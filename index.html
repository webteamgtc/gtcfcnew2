<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTCFC — Design drafts</title>
  <link rel="icon" href="https://www.gtcfx.com/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; background: #0e0f12; color: #f2f2f2; padding: 24px; }
    main { max-width: 520px; text-align: center; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0 0 28px; color: #a1a3aa; font-size: 0.95rem; line-height: 1.5; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a { display: block; padding: 14px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); color: inherit; text-decoration: none; font-weight: 600; transition: border-color .2s, background .2s; }
    a:hover { border-color: rgba(182,135,86,.6); background: rgba(255,255,255,.04); }
    a span { display: block; font-weight: 400; font-size: 0.8rem; color: #85878e; margin-top: 4px; }
    code { font-size: 0.75rem; color: #85878e; }
  </style>
</head>
<body>
  <main>
    <h1>GTC Financial Consultancy LLC</h1>
    <p>Each link opens the <strong>full website</strong> home.</p>
    <div class="links">
      <a href="draft1.html">Draft 1<span>Skyline 3D · stripe transitions</span></a>
      <a href="draft2.html">Draft 2<span>Gyroscope 3D · curtain transitions</span></a>
      <a href="draft3.html">Draft 3<span>Gem 3D · bento · tab nav</span></a>
    </div>
  </main>
</body>
</html>
