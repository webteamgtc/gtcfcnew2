<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTC Financial Consultancy LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap">
<style>
/* ---- palette: #293b93 blue · #b68756 bronze · #000 · #f2f2f2 · section greys ---- */
:root {
  --bg: #f2f2f2; --sec: #e6e6e9; --surface: #ffffff; --surface-2: #f7f7f8;
  --line: rgba(0, 0, 0, 0.1); --line-2: rgba(0, 0, 0, 0.18);
  --text: #000000; --muted: #55575e; --faint: #85878e;
  --blue: #293b93; --blue-ink: #293b93; --bronze: #b68756; --bronze-ink: #8e6338;
  --on-accent: #ffffff; --shadow: 0 24px 60px -28px rgba(18, 24, 60, 0.35);
  --head: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --wipe: cubic-bezier(.76, 0, .24, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
    --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
    --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
    --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
  --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
  --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
  --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
}
/* the page's own Light / Gray / Dark switch wins over the system setting */
:root[data-mode="light"] {
  --bg: #f2f2f2; --sec: #e6e6e9; --surface: #ffffff; --surface-2: #f7f7f8;
  --line: rgba(0, 0, 0, 0.1); --line-2: rgba(0, 0, 0, 0.18);
  --text: #000000; --muted: #55575e; --faint: #85878e;
  --blue-ink: #293b93; --bronze-ink: #8e6338; --shadow: 0 24px 60px -28px rgba(18, 24, 60, 0.35); color-scheme: light;
}
:root[data-mode="gray"] {
  --bg: #3a3b40; --sec: #44454b; --surface: #4e4f56; --surface-2: #57585f;
  --line: rgba(255, 255, 255, 0.12); --line-2: rgba(255, 255, 255, 0.22);
  --text: #f2f2f2; --muted: #c8c9ce; --faint: #9c9da4;
  --blue-ink: #b3bff5; --bronze-ink: #ddb184; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.6); color-scheme: dark;
}
:root[data-mode="dark"] {
  --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
  --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
  --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
  --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { height: 100%; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }
.mode-anim body, .mode-anim body * { transition: background-color .5s ease, color .5s ease, border-color .5s ease, fill .5s ease !important; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--head); letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 3px; border-radius: 6px; }
.w { display: inline-block; white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* motion primitives (all end visible) */
.rise { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .06em; }
.rise > span { display: inline-block; animation: rise .95s var(--ease) both; }
@keyframes rise { from { transform: translateY(112%); } to { transform: none; } }
.fade { animation: fade .9s var(--ease) both; }
@keyframes fade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.rv { transition: opacity .9s var(--ease), transform .9s var(--ease); }
.rv.pre { opacity: 0; transform: translateY(28px); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* Layout: Meridian — editorial split screen. Name and headline on the left, a 3D gyroscope inside a grey disc on the right */
.page { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
@media (min-width: 1024px) { .page { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; } }
.left { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; padding: 32px 16px 40px; }
@media (min-width: 640px) { .left { padding: 48px 56px 56px; } }

/* logo lockup */
.lockup { display: flex; align-items: center; gap: 16px; }
.lockup svg { width: 68px; height: 68px; flex: none; }
.lockup .draw { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 1.6s .2s var(--ease) forwards; }
.lockup .draw2 { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.4s .5s var(--ease) forwards; }
.lockup .dot { transform-origin: 21px 20px; animation: pop .6s 1.3s var(--ease) both; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { transform: scale(0); } }
.lockup .nm { display: grid; line-height: 1.15; }
.lockup .nm b { font-family: var(--head); font-weight: 600; font-size: clamp(20px, 2.2vw, 27px); letter-spacing: -0.01em; }
.lockup .nm span { font-family: var(--head); font-weight: 500; font-size: clamp(20px, 2.2vw, 27px); color: var(--bronze-ink); letter-spacing: -0.01em; }
.lockup .nm > * { animation: fade .9s var(--ease) both; }
.lockup .nm > *:nth-child(1) { animation-delay: .5s; } .lockup .nm > *:nth-child(2) { animation-delay: .65s; }

/* headline */
.badge { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 12px; border-radius: 999px; background: var(--blue); color: #fff; padding: clamp(12px, 1.3vw, 18px) clamp(22px, 2.4vw, 34px) clamp(12px, 1.3vw, 18px) clamp(18px, 1.8vw, 26px); font-family: var(--head); font-size: clamp(17px, 1.9vw, 26px); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; box-shadow: 0 14px 34px -14px color-mix(in srgb, var(--blue) 80%, transparent); animation: popIn .8s .55s var(--ease) both; }
.badge::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: shine 3.2s 1.6s ease-in-out infinite; }
.badge i { width: 12px; height: 12px; border-radius: 50%; background: var(--bronze); animation: ping 2s ease-out infinite; }
@keyframes shine { 0% { transform: translateX(-120%) skewX(-20deg); } 60%, 100% { transform: translateX(320%) skewX(-20deg); } }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); } 70%, 100% { box-shadow: 0 0 0 10px rgba(255,255,255,0); } }
@keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.92); } to { opacity: 1; transform: none; } }
.h1 { margin-top: 26px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.04; font-size: clamp(38px, 5vw, 72px); max-width: 12ch; }
.ch { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .06em; }
.ch > span { display: inline-block; animation: rise 1s var(--ease) both; }
.sp { display: inline-block; width: .26em; }
.h1 .b { color: var(--bronze); }
.lead { margin-top: 22px; max-width: 30em; font-size: clamp(16px, 1.4vw, 19px); color: var(--muted); animation: fade .9s 1.5s var(--ease) both; }
.rule { position: relative; margin-top: 30px; width: min(360px, 70%); height: 2px; background: var(--line); overflow: hidden; }
.rule::before { content: ""; position: absolute; inset: 0; background: var(--bronze); transform-origin: left; animation: grow 1.4s 1.2s var(--ease) both; }
.rule::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: linear-gradient(90deg, transparent, var(--blue-ink), transparent); animation: sweep 2.6s 2.6s ease-in-out infinite; transform: translateX(-120%); }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes sweep { to { transform: translateX(380%); } }
.foot { display: flex; gap: 10px; align-items: center; color: var(--faint); }
.foot i { width: 8px; height: 8px; border-radius: 50%; background: var(--bronze); animation: blink 1.8s ease-in-out infinite; }
.foot i:nth-child(2) { animation-delay: .3s; background: var(--blue-ink); } .foot i:nth-child(3) { animation-delay: .6s; background: var(--text); opacity: .5; }
@keyframes blink { 50% { opacity: .2; transform: scale(.7); } }

/* right: disc + gyroscope */
.right { position: relative; overflow: hidden; min-height: 46vh; display: grid; place-items: center; }
@media (min-width: 1024px) { .right { min-height: 100%; } }
.disc { position: relative; width: min(84vmin, 92%); aspect-ratio: 1; max-width: 680px; }
.disc::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; border: 1px solid var(--line); animation: grow2 1.4s .1s var(--ease) both; }
.disc::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px dashed var(--line-2); animation: spin 70s linear infinite; }
@keyframes grow2 { from { transform: scale(.6); opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
.scene { position: absolute; inset: 0; z-index: 1; opacity: 0; transition: opacity 1.4s ease .2s; }
.scene.ready { opacity: 1; }
.ticks { position: absolute; inset: -4%; animation: spin 120s linear infinite reverse; }
.ticks svg { width: 100%; height: 100%; }
</style>

<main class="page">
  <section class="left">
    <div class="lockup" aria-label="GTC Financial Consultancy LLC">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path class="draw" d="M31.6 10.4A15 15 0 1 0 35 20" stroke="var(--blue-ink)" stroke-width="2.6" stroke-linecap="round"/>
        <ellipse class="draw2" cx="20" cy="20" rx="6.2" ry="15" stroke="var(--text)" stroke-opacity=".45" stroke-width="1.3"/>
        <path class="draw2" d="M21 20h14" stroke="var(--bronze)" stroke-width="2.6" stroke-linecap="round"/>
        <circle class="dot" cx="21" cy="20" r="2.2" fill="var(--bronze)"/>
      </svg>
      <div class="nm"><b>GTC Financial</b><span>Consultancy LLC</span></div>
    </div>
    <div>
      <span class="badge"><i></i>Coming Soon</span>
      <h1 class="h1" id="h1">Something great is on its way.</h1>
      <p class="lead">GTC Financial Consultancy LLC is preparing a new experience. We're putting on the finishing touches, so please check back soon.</p>
      <div class="rule" aria-hidden="true"></div>
    </div>
    <div class="foot" aria-hidden="true"><i></i><i></i><i></i></div>
  </section>
  <section class="right" aria-hidden="true">
    <div class="disc">
      <div class="ticks"><svg viewBox="0 0 200 200" id="ticks"></svg></div>
      <div class="scene" id="scene"></div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
/* ===== shared helpers for the single-screen Coming Soon pages ===== */
const NAME = "GTC Financial Consultancy LLC";
// Colour mode follows the visitor's device. For previews, #light, #gray or #dark in the link forces a mode.
const Theme = (() => {
  const listeners = [];
  const media = matchMedia("(prefers-color-scheme: dark)");
  const forced = () => { const h = location.hash.replace("#", ""); return ["light", "gray", "dark"].includes(h) ? h : null; };
  const get = () => {
    const f = forced(); if (f) return f;
    const host = document.documentElement.getAttribute("data-theme");
    if (host === "dark" || host === "light") return host;
    return media.matches ? "dark" : "light";
  };
  const apply = () => {
    const f = forced();
    if (f) document.documentElement.setAttribute("data-mode", f); else document.documentElement.removeAttribute("data-mode");
    listeners.forEach((fn) => fn(get()));
  };
  media.addEventListener?.("change", apply);
  addEventListener("hashchange", apply);
  new MutationObserver(() => listeners.forEach((fn) => fn(get()))).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  apply();
  return { get, on: (fn) => listeners.push(fn), css: (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim() };
})();
const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
addEventListener("pointermove", (e) => { pointer.tx = (e.clientX / innerWidth) * 2 - 1; pointer.ty = -(e.clientY / innerHeight) * 2 + 1; });
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
// split text into letters that rise in one by one
const letters = (text, delay = 0, step = 0.045, cls = "") => {
  let i = 0;
  return text.split(" ").map((w) => `<span class="w">${w.split("").map((ch) => `<span class="ch"><span class="${cls}" style="animation-delay:${(delay + i++ * step).toFixed(3)}s">${ch}</span></span>`).join("")}</span>`).join('<span class="sp"> </span>');
};
// words rise one after another (for sentence headlines)
const wordsUp = (text, delay = 0, step = 0.08, cls = "") => text.split(" ").map((w, i) =>
  `<span class="ch"><span class="${cls}" style="animation-delay:${(delay + i * step).toFixed(2)}s">${w}</span></span>`).join(" ");
// build the 3D scene after first paint; pause it when hidden
function scene3d(slot, make) {
  if (!slot) return;
  setTimeout(() => {
    if (!window.THREE) return;
    let api; try { api = make(); } catch (e) { return; }
    const { renderer, camera, tick, onSize } = api;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    slot.appendChild(renderer.domElement);
    renderer.domElement.style.cssText = "width:100%;height:100%;display:block";
    let visible = true;
    new IntersectionObserver((es) => { visible = es[0].isIntersecting; }).observe(slot);
    const size = () => { const w = slot.clientWidth, h = slot.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; if (onSize) onSize(w, h); camera.updateProjectionMatrix(); };
    size(); addEventListener("resize", size);
    let last = performance.now(), t = 0;
    const loop = (now) => {
      requestAnimationFrame(loop);
      const dt = Math.min((now - last) / 1000, 0.05); last = now;
      if (!visible || document.hidden || window.__pause3d) return;
      t += dt * (reduceMotion ? 0.15 : 1);
      pointer.x += (pointer.tx - pointer.x) * 0.05; pointer.y += (pointer.ty - pointer.y) * 0.05;
      tick(t, dt);
    };
    requestAnimationFrame(loop);
    slot.classList.add("ready");
  }, 60);
}

  document.getElementById("h1").innerHTML = wordsUp("Something great is on its", 0.75) + " " + wordsUp("way.", 1.15, 0.08, "b");
  // compass ticks around the disc
  document.getElementById("ticks").innerHTML = Array.from({ length: 72 }, (_, i) => {
    const a = (i / 72) * Math.PI * 2, r1 = 99, r2 = i % 6 === 0 ? 94 : 97;
    return `<line x1="${100 + Math.cos(a) * r1}" y1="${100 + Math.sin(a) * r1}" x2="${100 + Math.cos(a) * r2}" y2="${100 + Math.sin(a) * r2}" stroke="var(--faint)" stroke-width="${i % 6 === 0 ? 0.8 : 0.4}"/>`;
  }).join("");

  scene3d(document.getElementById("scene"), () => {
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    const sc = new THREE.Scene(), camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100); camera.position.set(0, 0, 6.4);
    const mat = (c) => new THREE.MeshBasicMaterial({ color: c, transparent: true });
    const mBlue = mat(0x293b93), mBronze = mat(0xb68756), mText = mat(0x000000), mFine = mat(0x000000);
    mFine.opacity = 0.35;
    const ring = (r, t, m) => new THREE.Mesh(new THREE.TorusGeometry(r, t, 16, 240), m);
    const g = new THREE.Group(); sc.add(g);
    const r1 = ring(1.75, 0.032, mBlue), r2 = ring(1.42, 0.032, mBronze), r3 = ring(1.1, 0.018, mText), r4 = ring(2.05, 0.006, mFine), r5 = ring(0.78, 0.012, mBlue);
    g.add(r1, r2, r3, r4, r5);
    const core = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 32), mBronze); g.add(core);
    const halo = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.34, 64), mBronze); g.add(halo);
    const sats = [0, 1, 2, 3].map((i) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 16), i % 2 ? mBronze : mBlue); g.add(m); return m; });
    const dp = new Float32Array(900 * 3);
    for (let i = 0; i < 900; i++) { const a = Math.random() * Math.PI * 2, b = Math.acos(2 * Math.random() - 1), rr = 2.2 + Math.random() * 0.7; dp.set([rr * Math.sin(b) * Math.cos(a), rr * Math.cos(b), rr * Math.sin(b) * Math.sin(a)], i * 3); }
    const dg = new THREE.BufferGeometry(); dg.setAttribute("position", new THREE.BufferAttribute(dp, 3));
    const pm = new THREE.PointsMaterial({ size: 0.02, color: 0xb68756, transparent: true, opacity: 0.75 }); const pts = new THREE.Points(dg, pm); g.add(pts);
    const recolor = () => { const tx = Theme.css("--text") || "#000"; mText.color.set(tx); mFine.color.set(tx); mBlue.color.set(Theme.css("--blue-ink") || "#293b93"); };
    recolor(); Theme.on(() => setTimeout(recolor, 30));
    let intro = 0; const t0 = performance.now();
    return {
      renderer, camera,
      tick(t, dt) {
        intro = Math.min(1, (performance.now() - t0) / 1700); const e = 1 - Math.pow(1 - intro, 3);
        g.scale.setScalar(0.55 + 0.45 * e);
        r1.rotation.set(t * 0.5, t * 0.3, 0); r2.rotation.set(Math.PI / 2 + t * 0.35, 0, t * 0.45);
        r3.rotation.set(t * 0.2, Math.PI / 3 + t * 0.6, 0); r4.rotation.set(Math.PI / 2.3, 0, t * 0.05); r5.rotation.set(-t * 0.7, t * 0.4, 0);
        sats.forEach((s, i) => { const a = t * (0.6 + i * 0.22) + i * 1.6, r = 1.75 - i * 0.3; s.position.set(Math.cos(a) * r, Math.sin(a * 0.7) * 0.6, Math.sin(a) * r); });
        core.scale.setScalar(1 + Math.sin(t * 2) * 0.08); halo.lookAt(camera.position); halo.scale.setScalar(1 + (t % 2) * 0.6); halo.material.opacity = 1;
        pts.rotation.y = t * 0.04;
        g.rotation.y = pointer.x * 0.45; g.rotation.x = -pointer.y * 0.3;
        renderer.render(sc, camera);
      },
    };
  });
})();
</script>

</html>
