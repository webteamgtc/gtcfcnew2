<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTC Financial Consultancy LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500&display=swap">
<style>
/* ---- palette: #293b93 blue · #b68756 bronze · #000 · #f2f2f2 · section greys ---- */
:root {
  --bg: #f2f2f2; --sec: #e6e6e9; --surface: #ffffff; --surface-2: #f7f7f8;
  --line: rgba(0, 0, 0, 0.1); --line-2: rgba(0, 0, 0, 0.18);
  --text: #000000; --muted: #55575e; --faint: #85878e;
  --blue: #293b93; --blue-ink: #293b93; --bronze: #b68756; --bronze-ink: #8e6338;
  --on-accent: #ffffff; --shadow: 0 24px 60px -28px rgba(18, 24, 60, 0.35);
  --head: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --wipe: cubic-bezier(.76, 0, .24, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
    --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
    --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
    --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
  --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
  --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
  --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
}
/* the page's own Light / Gray / Dark switch wins over the system setting */
:root[data-mode="light"] {
  --bg: #f2f2f2; --sec: #e6e6e9; --surface: #ffffff; --surface-2: #f7f7f8;
  --line: rgba(0, 0, 0, 0.1); --line-2: rgba(0, 0, 0, 0.18);
  --text: #000000; --muted: #55575e; --faint: #85878e;
  --blue-ink: #293b93; --bronze-ink: #8e6338; --shadow: 0 24px 60px -28px rgba(18, 24, 60, 0.35); color-scheme: light;
}
:root[data-mode="gray"] {
  --bg: #3a3b40; --sec: #44454b; --surface: #4e4f56; --surface-2: #57585f;
  --line: rgba(255, 255, 255, 0.12); --line-2: rgba(255, 255, 255, 0.22);
  --text: #f2f2f2; --muted: #c8c9ce; --faint: #9c9da4;
  --blue-ink: #b3bff5; --bronze-ink: #ddb184; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.6); color-scheme: dark;
}
:root[data-mode="dark"] {
  --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
  --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
  --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
  --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { height: 100%; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }
.mode-anim body, .mode-anim body * { transition: background-color .5s ease, color .5s ease, border-color .5s ease, fill .5s ease !important; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--head); letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 3px; border-radius: 6px; }
.w { display: inline-block; white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* motion primitives (all end visible) */
.rise { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .06em; }
.rise > span { display: inline-block; animation: rise .95s var(--ease) both; }
@keyframes rise { from { transform: translateY(112%); } to { transform: none; } }
.fade { animation: fade .9s var(--ease) both; }
@keyframes fade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.rv { transition: opacity .9s var(--ease), transform .9s var(--ease); }
.rv.pre { opacity: 0; transform: translateY(28px); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* Layout: Atlas — bold and structural. Column grid, square edges, giant uppercase headline, a 3D skyline of bars, striped wipe on arrival */
.gridlines { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: flex; justify-content: center; }
.gridlines div { width: 100%; max-width: 1400px; margin-inline: 16px; display: grid; grid-template-columns: repeat(4, 1fr); border-inline: 1px solid var(--line); }
@media (min-width: 640px) { .gridlines div { margin-inline: 32px; grid-template-columns: repeat(6, 1fr); } }
.gridlines span { border-right: 1px solid var(--line); }
.gridlines span:last-child { border-right: 0; }
.page { position: relative; z-index: 1; min-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.top { display: flex; align-items: center; border-bottom: 1px solid var(--line); padding: 20px 16px; background: var(--bg); }
@media (min-width: 640px) { .top { padding: 24px 32px; } }

/* logo lockup */
.lockup { display: flex; align-items: center; gap: 14px; }
.lockup svg { width: 56px; height: 56px; flex: none; }
.lockup .bar { transform-box: fill-box; transform-origin: bottom; animation: up .8s var(--ease) both; }
.lockup .bar:nth-of-type(2) { animation-delay: 1.15s; } .lockup .bar:nth-of-type(3) { animation-delay: 1.25s; } .lockup .bar:nth-of-type(4) { animation-delay: 1.35s; }
@keyframes up { from { transform: scaleY(0); } }
.lockup .nm { display: grid; font-family: var(--head); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; line-height: 1.1; font-size: clamp(16px, 1.9vw, 22px); }
.lockup .nm span { color: var(--bronze-ink); }

/* headline */
.main { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; padding: 6vh 16px 0; }
@media (min-width: 640px) { .main { padding-inline: 32px; } }
.h1 { position: relative; z-index: 2; margin-top: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.045em; line-height: .9; font-size: clamp(46px, 7.6vw, 124px); }
.h1 .line { display: block; overflow: hidden; }
.h1 .line > span { display: block; animation: slideR 1.1s var(--ease) both; }
.h1 .line:nth-child(1) > span { animation-delay: 1.05s; } .h1 .line:nth-child(2) > span { animation-delay: 1.17s; } .h1 .line:nth-child(3) > span { animation-delay: 1.29s; }
.h1 .blue { color: var(--blue-ink); }
.tag { position: relative; z-index: 2; overflow: hidden; align-self: flex-start; display: inline-flex; align-items: center; gap: 14px; background: var(--blue); color: #fff; padding: clamp(12px, 1.3vw, 18px) clamp(22px, 2.4vw, 34px) clamp(12px, 1.3vw, 18px) clamp(18px, 1.8vw, 26px); font-family: var(--head); font-size: clamp(17px, 1.9vw, 26px); font-weight: 700; letter-spacing: .18em; text-transform: uppercase; animation: popIn .7s .95s var(--ease) both; }
.tag::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--bronze); }
.tag::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent); animation: shine 3.2s 2s ease-in-out infinite; }
.tag i { width: 13px; height: 13px; background: var(--bronze); animation: pulse 1.6s ease-in-out infinite; }
@keyframes shine { 0% { transform: translateX(-120%) skewX(-20deg); } 60%, 100% { transform: translateX(320%) skewX(-20deg); } }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); } 70%, 100% { box-shadow: 0 0 0 10px rgba(255,255,255,0); } }
@keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.92); } to { opacity: 1; transform: none; } }
.lead { position: relative; z-index: 2; margin-top: 24px; max-width: 30em; font-size: clamp(16px, 1.4vw, 19px); color: var(--muted); animation: fade .9s 1.6s var(--ease) both; }
@media (min-width: 1024px) { .lead { max-width: 26em; } }
@keyframes slideR { from { transform: translateX(-104%); } }
.h1 .out { color: transparent; -webkit-text-stroke: 1.5px var(--text); }
.h1 .sq { display: inline-block; width: .16em; height: .16em; margin-left: .04em; background: var(--bronze); vertical-align: baseline; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.55); } }
.city { position: relative; z-index: 1; width: 100%; height: clamp(240px, 38vh, 360px); margin-top: 8px; opacity: 0; transition: opacity 1.4s ease .3s; }
.city.ready { opacity: 1; }
@media (min-width: 1024px) { .city { position: absolute; right: 0; bottom: 0; margin: 0; width: 50%; height: 92%; } }

/* marquee */
.marq { position: relative; z-index: 2; overflow: hidden; border-top: 1px solid var(--line); background: var(--sec); padding-block: 14px; }
.marq .track { display: flex; width: max-content; animation: tick 28s linear infinite; }
.marq span { display: inline-flex; align-items: center; gap: 26px; padding-right: 26px; font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: -0.02em; font-size: clamp(20px, 2.6vw, 34px); line-height: 1.1; }
.marq span:nth-child(even) { color: transparent; -webkit-text-stroke: 1.2px var(--text); }
.marq span::after { content: ""; width: .38em; height: .38em; background: var(--bronze); }
@keyframes tick { to { transform: translateX(-50%); } }

/* arrival wipe */
.stripes { position: fixed; inset: 0; z-index: 50; pointer-events: none; display: grid; grid-template-columns: repeat(5, 1fr); }
.stripes i { background: var(--blue); transform-origin: bottom; animation: lift .7s var(--wipe) both; }
.stripes i:nth-child(even) { background: var(--bronze); }
.stripes i:nth-child(1) { animation-delay: .15s; } .stripes i:nth-child(2) { animation-delay: .22s; } .stripes i:nth-child(3) { animation-delay: .29s; } .stripes i:nth-child(4) { animation-delay: .36s; } .stripes i:nth-child(5) { animation-delay: .43s; }
@keyframes lift { to { transform: scaleY(0); } }
</style>

<div class="gridlines" aria-hidden="true"><div><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
<main class="page">
  <header class="top">
    <div class="lockup" aria-label="GTC Financial Consultancy LLC">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="1.5" y="1.5" width="37" height="37" fill="none" stroke="var(--text)" stroke-width="3"/>
        <rect class="bar" x="9" y="22" width="5.5" height="10" fill="var(--blue-ink)"/><rect class="bar" x="17.25" y="15" width="5.5" height="17" fill="var(--blue-ink)"/><rect class="bar" x="25.5" y="8" width="5.5" height="24" fill="var(--bronze)"/></svg>
      <div class="nm">GTC Financial <span>Consultancy LLC</span></div>
    </div>
  </header>
  <section class="main">
    <span class="tag"><i></i>Coming Soon</span>
    <h1 class="h1" aria-label="Preparing something great."><span class="line"><span>Preparing</span></span><span class="line"><span class="out">something</span></span><span class="line"><span><span class="blue">great</span><span class="sq" aria-hidden="true"></span></span></span></h1>
    <p class="lead">GTC Financial Consultancy LLC is getting ready to open its doors in Dubai. More is coming very soon.</p>
    <div class="city" id="scene" aria-hidden="true"></div>
  </section>
  <div class="marq" aria-hidden="true"><div class="track" id="marq"></div></div>
</main>
<div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
/* ===== shared helpers for the single-screen Coming Soon pages ===== */
const NAME = "GTC Financial Consultancy LLC";
// Colour mode follows the visitor's device. For previews, #light, #gray or #dark in the link forces a mode.
const Theme = (() => {
  const listeners = [];
  const media = matchMedia("(prefers-color-scheme: dark)");
  const forced = () => { const h = location.hash.replace("#", ""); return ["light", "gray", "dark"].includes(h) ? h : null; };
  const get = () => {
    const f = forced(); if (f) return f;
    const host = document.documentElement.getAttribute("data-theme");
    if (host === "dark" || host === "light") return host;
    return media.matches ? "dark" : "light";
  };
  const apply = () => {
    const f = forced();
    if (f) document.documentElement.setAttribute("data-mode", f); else document.documentElement.removeAttribute("data-mode");
    listeners.forEach((fn) => fn(get()));
  };
  media.addEventListener?.("change", apply);
  addEventListener("hashchange", apply);
  new MutationObserver(() => listeners.forEach((fn) => fn(get()))).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  apply();
  return { get, on: (fn) => listeners.push(fn), css: (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim() };
})();
const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
addEventListener("pointermove", (e) => { pointer.tx = (e.clientX / innerWidth) * 2 - 1; pointer.ty = -(e.clientY / innerHeight) * 2 + 1; });
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
// split text into letters that rise in one by one
const letters = (text, delay = 0, step = 0.045, cls = "") => {
  let i = 0;
  return text.split(" ").map((w) => `<span class="w">${w.split("").map((ch) => `<span class="ch"><span class="${cls}" style="animation-delay:${(delay + i++ * step).toFixed(3)}s">${ch}</span></span>`).join("")}</span>`).join('<span class="sp"> </span>');
};
// words rise one after another (for sentence headlines)
const wordsUp = (text, delay = 0, step = 0.08, cls = "") => text.split(" ").map((w, i) =>
  `<span class="ch"><span class="${cls}" style="animation-delay:${(delay + i * step).toFixed(2)}s">${w}</span></span>`).join(" ");
// build the 3D scene after first paint; pause it when hidden
function scene3d(slot, make) {
  if (!slot) return;
  setTimeout(() => {
    if (!window.THREE) return;
    let api; try { api = make(); } catch (e) { return; }
    const { renderer, camera, tick, onSize } = api;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    slot.appendChild(renderer.domElement);
    renderer.domElement.style.cssText = "width:100%;height:100%;display:block";
    let visible = true;
    new IntersectionObserver((es) => { visible = es[0].isIntersecting; }).observe(slot);
    const size = () => { const w = slot.clientWidth, h = slot.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; if (onSize) onSize(w, h); camera.updateProjectionMatrix(); };
    size(); addEventListener("resize", size);
    let last = performance.now(), t = 0;
    const loop = (now) => {
      requestAnimationFrame(loop);
      const dt = Math.min((now - last) / 1000, 0.05); last = now;
      if (!visible || document.hidden || window.__pause3d) return;
      t += dt * (reduceMotion ? 0.15 : 1);
      pointer.x += (pointer.tx - pointer.x) * 0.05; pointer.y += (pointer.ty - pointer.y) * 0.05;
      tick(t, dt);
    };
    requestAnimationFrame(loop);
    slot.classList.add("ready");
  }, 60);
}

  document.getElementById("marq").innerHTML = Array(10).fill("<span>Coming soon</span>").join("");

  scene3d(document.getElementById("scene"), () => {
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    const sc = new THREE.Scene(), camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
    const place = (w) => { camera.position.set(14, 12, 14).setLength(w < 640 ? 24 : 22); camera.lookAt(0, 0.8, 0); };
    place(innerWidth);
    const amb = new THREE.AmbientLight(0xffffff, 0.55); sc.add(amb);
    const d1 = new THREE.DirectionalLight(0xffffff, 0.9); d1.position.set(6, 12, 4); sc.add(d1);
    const d2 = new THREE.DirectionalLight(0x8e9de0, 0.5); d2.position.set(-8, 4, -2); sc.add(d2);
    const N = 14, S = 0.62, count = N * N;
    const geo = new THREE.BoxGeometry(0.5, 1, 0.5); geo.translate(0, 0.5, 0);
    const mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color: 0xffffff }), count); sc.add(mesh);
    const dummy = new THREE.Object3D(), col = new THREE.Color(), cBase = new THREE.Color(), cBlue = new THREE.Color(0x293b93), cBronze = new THREE.Color(0xb68756);
    const recolor = () => { const m = Theme.get(); cBase.set(m === "light" ? 0xdcdde2 : m === "gray" ? 0x6a6b73 : 0x26272d); };
    recolor(); Theme.on(() => setTimeout(recolor, 30));
    let intro = 0; const t0 = performance.now();
    return {
      renderer, camera, onSize: (w) => place(w),
      tick(t, dt) {
        intro = Math.min(1, (performance.now() - t0) / 2200);
        let k = 0;
        for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
          const x = (i - N / 2 + 0.5) * S, z = (j - N / 2 + 0.5) * S;
          const grow = Math.min(1, Math.max(0, intro * 2.2 - (i + j) / (2 * N)));
          const h = 0.25 + Math.max(0, Math.sin(i * 0.55 + t * 1.1) * 0.9 + Math.cos(j * 0.48 - t * 0.8) * 0.9 + Math.sin((i + j) * 0.3 + t * 0.6) * 0.7 + 1.1) * 0.85;
          const hh = Math.max(0.02, h * (1 - Math.pow(1 - grow, 3)));
          dummy.position.set(x, 0, z); dummy.scale.set(1, hh, 1); dummy.updateMatrix(); mesh.setMatrixAt(k, dummy.matrix);
          const v = (h - 0.25) / 3.2;
          if (v > 0.82) col.copy(cBronze); else if (v > 0.5) col.copy(cBase).lerp(cBlue, (v - 0.5) / 0.32); else col.copy(cBase);
          mesh.setColorAt(k, col); k++;
        }
        mesh.instanceMatrix.needsUpdate = true; if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
        mesh.rotation.y = pointer.x * 0.35;
        renderer.render(sc, camera);
      },
    };
  });
})();
</script>
