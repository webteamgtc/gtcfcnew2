<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTCFC Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* ---- palette: #293b93 blue · #b68756 bronze · #000 · #f2f2f2 · section greys ---- */
:root {
  --bg: #f2f2f2; --sec: #e6e6e9; --surface: #ffffff; --surface-2: #f7f7f8;
  --line: rgba(0, 0, 0, 0.1); --line-2: rgba(0, 0, 0, 0.18);
  --text: #000000; --muted: #55575e; --faint: #85878e;
  --blue: #293b93; --blue-ink: #293b93; --bronze: #b68756; --bronze-ink: #8e6338;
  --on-accent: #ffffff; --shadow: 0 24px 60px -28px rgba(18, 24, 60, 0.35);
  --head: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --wipe: cubic-bezier(.76, 0, .24, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
    --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
    --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
    --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
  --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
  --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
  --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
}
/* the page's own Light / Gray / Dark switch wins over the system setting */
:root[data-mode="light"] {
  --bg: #f2f2f2; --sec: #e6e6e9; --surface: #ffffff; --surface-2: #f7f7f8;
  --line: rgba(0, 0, 0, 0.1); --line-2: rgba(0, 0, 0, 0.18);
  --text: #000000; --muted: #55575e; --faint: #85878e;
  --blue-ink: #293b93; --bronze-ink: #8e6338; --shadow: 0 24px 60px -28px rgba(18, 24, 60, 0.35); color-scheme: light;
}
:root[data-mode="gray"] {
  --bg: #3a3b40; --sec: #44454b; --surface: #4e4f56; --surface-2: #57585f;
  --line: rgba(255, 255, 255, 0.12); --line-2: rgba(255, 255, 255, 0.22);
  --text: #f2f2f2; --muted: #c8c9ce; --faint: #9c9da4;
  --blue-ink: #b3bff5; --bronze-ink: #ddb184; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.6); color-scheme: dark;
}
:root[data-mode="dark"] {
  --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
  --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
  --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
  --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }
.mode-anim body, .mode-anim body * { transition: background-color .5s ease, color .5s ease, border-color .5s ease, fill .5s ease !important; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--head); letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* motion primitives (all end visible) */
.rise { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .06em; }
.rise > span { display: inline-block; animation: rise .95s var(--ease) both; }
@keyframes rise { from { transform: translateY(112%); } to { transform: none; } }
.fade { animation: fade .9s var(--ease) both; }
@keyframes fade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.rv { transition: opacity .9s var(--ease), transform .9s var(--ease); }
.rv.pre { opacity: 0; transform: translateY(28px); }

/* Light / Gray / Dark switch */
.modes { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.modes button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--muted); transition: background .3s, color .3s; }
.modes button svg { width: 15px; height: 15px; }
.modes button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.modes.compact span { display: none; }

/* preview bar */
.pbar { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); z-index: 90; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: 12px; max-width: calc(100vw - 32px); }
.pbar span { padding: 7px 10px 7px 12px; color: var(--faint); white-space: nowrap; }
.pbar a { padding: 7px 14px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
.pbar a.on { background: var(--blue); color: #fff; font-weight: 600; }
@media (max-width: 420px) { .pbar span { display: none; } }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* Layout: Atlas — bold and structural. Square edges, a visible column grid, uppercase display type, a 3D skyline of bars, striped wipe between pages */
.wrap { width: 100%; max-width: 1320px; margin-inline: auto; padding-inline: 16px; }
@media (min-width: 640px) { .wrap { padding-inline: 32px; } }
.gridlines { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: flex; justify-content: center; }
.gridlines div { width: 100%; max-width: 1320px; margin-inline: 16px; display: grid; grid-template-columns: repeat(4, 1fr); border-inline: 1px solid var(--line); }
@media (min-width: 640px) { .gridlines div { margin-inline: 32px; grid-template-columns: repeat(6, 1fr); } }
.gridlines span { border-right: 1px solid var(--line); }
.gridlines span:last-child { border-right: 0; }
#app { position: relative; z-index: 1; }
.up { text-transform: uppercase; }

/* logo: rising bars */
.logo { display: inline-flex; align-items: center; gap: 10px; }
.logo svg { width: 34px; height: 34px; flex: none; }
.logo b { font-family: var(--head); font-weight: 800; font-size: 20px; letter-spacing: .08em; }

/* header */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); border-bottom: 1px solid var(--line); }
.hdr .wrap { display: flex; align-items: center; justify-content: space-between; gap: 20px; height: 72px; }
.nav { display: none; gap: 4px; }
.nav a { display: inline-flex; gap: 6px; padding: 8px 12px; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); transition: color .2s, background .2s; }
.nav a i { font-style: normal; color: var(--bronze-ink); }
.nav a:hover { color: var(--text); background: var(--sec); }
.nav a.active { color: #fff; background: var(--blue); }
.nav a.active i { color: #e2c49f; }
.hright { display: none; align-items: center; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 22px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border: 1.5px solid transparent; cursor: pointer; background: none; transition: background .25s, color .25s, border-color .25s, transform .25s ease-out; }
.btn svg { width: 16px; height: 16px; }
.btn-blue { background: var(--blue); color: #fff; }
.btn-blue:hover { background: var(--bronze); }
.btn-line { border-color: var(--text); color: var(--text); }
.btn-line:hover { background: var(--text); color: var(--bg); }
.modes { border-radius: 0; }
.modes button { border-radius: 0; }
.sqb { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1.5px solid var(--text); background: none; cursor: pointer; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
.sqb svg { width: 18px; height: 18px; }
@media (min-width: 1100px) { .nav, .hright { display: flex; } #menuBtn { display: none; } }
.drawer { position: fixed; inset: 0; z-index: 70; background: var(--blue); color: #fff; padding-top: env(safe-area-inset-top, 0px); overflow-y: auto; animation: dropIn .6s var(--wipe) both; }
.drawer.closing { animation: dropOut .45s var(--wipe) both; }
@keyframes dropIn { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
@keyframes dropOut { to { clip-path: inset(0 0 100% 0); } }
.drawer .top { display: flex; justify-content: space-between; align-items: center; height: 72px; border-bottom: 1px solid rgba(255,255,255,.2); }
.drawer .top .logo { color: #fff; }
.drawer .sqb { border-color: #fff; color: #fff; }
.drawer nav { display: grid; padding-block: 18px; }
.drawer nav a { display: flex; gap: 14px; align-items: baseline; padding-block: 12px; font-family: var(--head); font-weight: 700; font-size: clamp(28px, 7vw, 44px); text-transform: uppercase; letter-spacing: -0.02em; border-bottom: 1px solid rgba(255,255,255,.15); animation: fade .5s var(--ease) both; }
.drawer nav a i { font-style: normal; font-size: 13px; color: #e2c49f; letter-spacing: .1em; }
.drawer .modes { margin-bottom: 96px; }

/* hero */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero .wrap { display: grid; gap: 12px; padding-block: 48px 0; }
@media (min-width: 1024px) { .hero .wrap { grid-template-columns: 1.1fr 1fr; align-items: end; padding-block: 72px 0; } }
.tagline { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--bronze-ink); }
.tagline i { width: 10px; height: 10px; background: var(--bronze); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.5); } }
.h1 { margin-top: 20px; font-weight: 800; text-transform: uppercase; line-height: .9; letter-spacing: -0.045em; font-size: clamp(48px, 8vw, 118px); }
.h1 .line { display: block; overflow: hidden; }
.h1 .line > span { display: block; animation: slideR 1s var(--ease) both; }
@keyframes slideR { from { transform: translateX(-104%); } to { transform: none; } }
.h1 .blue { color: var(--blue-ink); }
.h1 .out { color: transparent; -webkit-text-stroke: 1.5px var(--text); }
.lead { margin-top: 26px; max-width: 30em; font-size: 18px; color: var(--muted); }
.actions { margin-block: 32px 48px; display: flex; flex-wrap: wrap; gap: 10px; }
.city { position: relative; height: clamp(300px, 42vw, 560px); }
.city .scene { position: absolute; inset: 0; }

/* marquee */
.marq { overflow: hidden; border-bottom: 1px solid var(--line); background: var(--sec); padding-block: 18px; }
.marq .track { display: flex; width: max-content; animation: tick 26s linear infinite; }
.marq span { display: inline-flex; align-items: center; gap: 28px; padding-right: 28px; font-family: var(--head); font-weight: 800; text-transform: uppercase; letter-spacing: -0.02em; font-size: clamp(30px, 4.4vw, 56px); line-height: 1.1; }
.marq span:nth-child(even) { color: transparent; -webkit-text-stroke: 1.2px var(--text); }
.marq span::after { content: ""; width: .4em; height: .4em; background: var(--bronze); }
@keyframes tick { to { transform: translateX(-50%); } }

/* teasers */
.trio { display: grid; border-bottom: 1px solid var(--line); }
@media (min-width: 768px) { .trio { grid-template-columns: repeat(3, 1fr); } }
.trio > div { padding: 40px 0; border-bottom: 1px solid var(--line); }
@media (min-width: 768px) { .trio > div { padding: 48px 28px; border-bottom: 0; border-right: 1px solid var(--line); } .trio > div:first-child { padding-left: 0; } .trio > div:last-child { border-right: 0; } }
.num { font-family: var(--head); font-weight: 800; font-size: 72px; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px var(--bronze); }
.trio h3 { margin-top: 18px; font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em; }
.trio p { margin-top: 8px; color: var(--muted); }

/* nav panel */
.sec { padding-block: 96px; }
.h2 { font-weight: 800; text-transform: uppercase; letter-spacing: -0.04em; line-height: .95; font-size: clamp(36px, 5.4vw, 72px); }
.shead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 36px; }
.shead p { max-width: 24em; color: var(--muted); }
.npanel { border: 1.5px solid var(--text); background: var(--surface); }
.np-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1.5px solid var(--text); }
.pill { padding: 6px 12px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; background: var(--text); color: var(--bg); }
.np-grid { display: grid; }
@media (min-width: 640px) { .np-grid { grid-template-columns: 1fr 1fr; } }
.ncard { position: relative; overflow: hidden; padding: 26px 22px; border-bottom: 1px solid var(--line); }
@media (min-width: 640px) { .ncard:nth-child(odd) { border-right: 1px solid var(--line); } }
.ncard::before { content: ""; position: absolute; inset: 0; background: var(--blue); transform: translateY(101%); transition: transform .5s var(--wipe); }
.ncard > * { position: relative; transition: color .3s; }
.ncard:hover::before { transform: none; }
.ncard:hover > * { color: #fff; }
.ncard h3 { font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em; display: flex; justify-content: space-between; align-items: center; }
.ncard h3 svg { width: 20px; height: 20px; transition: transform .4s var(--ease); }
.ncard:hover h3 svg { transform: rotate(-45deg); }
.ncard p { margin-top: 8px; color: var(--muted); font-size: 15px; }
.ncard p a:hover { text-decoration: underline; }
.nact { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 12px; text-align: center; transition: background .3s, color .3s; }
@media (min-width: 640px) { .nact:first-of-type { border-right: 1px solid var(--line); } }
.nact:hover { background: var(--bronze); color: #fff; }
.nact svg { width: 28px; height: 28px; }
.nact strong { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
.nact small { font-size: 12px; opacity: .7; }

/* CTA */
.cta { background: var(--blue); color: #fff; }
.cta .wrap { display: grid; gap: 28px; padding-block: 72px; }
@media (min-width: 900px) { .cta .wrap { grid-template-columns: 1.4fr 1fr; align-items: end; } }
.cta h2 { font-weight: 800; text-transform: uppercase; letter-spacing: -0.04em; line-height: .95; font-size: clamp(40px, 6vw, 84px); }
.cta .btn { background: #fff; color: #000; }
.cta .btn:hover { background: var(--bronze); color: #fff; }
.cta small { display: block; margin-top: 10px; font-size: 12px; color: rgba(255,255,255,.7); min-height: 1.4em; }

/* inner pages */
.phero { border-bottom: 1px solid var(--line); }
.phero .wrap { padding-block: 64px 48px; }
.phero h1 { margin-top: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.045em; line-height: .92; font-size: clamp(42px, 7.6vw, 108px); }
.phero h1 .line { display: block; overflow: hidden; }
.phero h1 .line > span { display: block; animation: slideR 1s var(--ease) both; }
.phero p { margin-top: 24px; max-width: 34em; font-size: 18px; color: var(--muted); }
.jumps { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.jumps .wrap { display: flex; overflow-x: auto; }
.jumps button { flex: none; border: 0; border-right: 1px solid var(--line); background: none; cursor: pointer; padding: 16px 20px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); transition: background .25s, color .25s; }
.jumps button:first-child { border-left: 1px solid var(--line); }
.jumps button.on { background: var(--text); color: var(--bg); }
.psec { border-bottom: 1px solid var(--line); scroll-margin-top: 140px; }
.psec:nth-child(even) { background: var(--sec); }
.psec .wrap { display: grid; gap: 22px; padding-block: 56px; }
@media (min-width: 1024px) { .psec .wrap { grid-template-columns: 300px minmax(0, 1fr); gap: 40px; } }
.psec .idx { font-family: var(--head); font-weight: 800; font-size: 64px; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px var(--bronze); }
.psec .lbl small { display: block; margin-top: 10px; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.psec h2 { font-size: clamp(26px, 3.4vw, 40px); font-weight: 800; text-transform: uppercase; letter-spacing: -0.03em; line-height: 1; }
.psec .body > p { margin-top: 12px; color: var(--muted); max-width: 40em; }
.psec .body { min-width: 0; }
.cards { display: grid; margin-top: 26px; border: 1px solid var(--line-2); }
@media (min-width: 640px) { .cards.n2, .cards.n4 { grid-template-columns: 1fr 1fr; } .cards.n3 { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1024px) { .cards.n4 { grid-template-columns: repeat(4, 1fr); } }
.card { padding: 22px; min-height: 130px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; background: var(--surface); border-bottom: 1px solid var(--line-2); transition: background .3s, color .3s; }
@media (min-width: 640px) { .card { border-bottom: 0; border-right: 1px solid var(--line-2); } .card:last-child { border-right: 0; } .cards.n4 .card:nth-child(2) { border-right: 0; } .cards.n4 .card:nth-child(-n+2) { border-bottom: 1px solid var(--line-2); } }
@media (min-width: 1024px) { .cards.n4 .card:nth-child(2) { border-right: 1px solid var(--line-2); } .cards.n4 .card:nth-child(-n+2) { border-bottom: 0; } }
.card:hover { background: var(--blue); color: #fff; }
.card:hover .badge { color: #fff; border-color: rgba(255,255,255,.6); }
.card h3 { font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: .01em; }
.badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 4px 9px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--bronze); color: var(--bronze-ink); }
.badge::before { content: ""; width: 6px; height: 6px; background: var(--bronze); animation: pulse 1.6s ease-in-out infinite; }
.plain { font-size: 14px; color: var(--muted); }
.card:hover .plain { color: rgba(255,255,255,.8); }
.list { list-style: none; margin: 24px 0 0; padding: 0; border-top: 1px solid var(--line-2); }
.list li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line-2); font-weight: 600; }
.faq { margin-top: 22px; border-top: 1px solid var(--line-2); }
.faq details { border-bottom: 1px solid var(--line-2); }
.faq summary { list-style: none; cursor: pointer; padding: 18px 0; font-weight: 600; display: flex; justify-content: space-between; gap: 14px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-family: var(--head); font-weight: 800; font-size: 22px; line-height: 1; color: var(--bronze-ink); transition: transform .3s; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq details p { padding-bottom: 18px; color: var(--muted); animation: fade .4s var(--ease) both; }
.contact { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.contact .mail { font-family: var(--head); font-weight: 800; font-size: clamp(20px, 2.8vw, 30px); letter-spacing: -0.02em; }
.contact small { font-size: 13px; color: var(--faint); min-height: 1.4em; }

/* footer */
.footer { border-top: 1.5px solid var(--text); background: var(--bg); }
.footer .wrap { padding-block: 48px 96px; display: grid; gap: 32px; }
.ftop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px; }
.flinks { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.flinks a:hover { color: var(--text); }
.bigword { font-family: var(--head); font-weight: 800; letter-spacing: -0.06em; line-height: .78; font-size: clamp(72px, 19vw, 280px); color: transparent; -webkit-text-stroke: 1.5px var(--line-2); user-select: none; }
.fbase { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--faint); }

/* coming soon */
.cs { position: relative; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.cs .scene { position: absolute; right: 0; bottom: 0; width: 100%; height: 42%; }
@media (min-width: 1024px) { .cs .scene { width: 50%; height: 68%; } }
.cs-top { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 20px 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
@media (min-width: 640px) { .cs-top { padding-inline: 32px; } }
.cs-mid { position: relative; z-index: 2; padding: 6vh 16px 0; }
@media (min-width: 640px) { .cs-mid { padding-inline: 32px; } }
.cs h1 { font-weight: 800; text-transform: uppercase; letter-spacing: -0.05em; line-height: .86; font-size: clamp(64px, 15vw, 230px); }
.cs h1 .line { display: block; overflow: hidden; }
.cs h1 .line > span { display: block; animation: slideR 1.1s var(--ease) both; }
.cs h1 .out { color: transparent; -webkit-text-stroke: 2px var(--text); }
.cs-row { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; margin-top: 26px; max-width: 560px; }
.cs .sub { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; font-size: clamp(16px, 2vw, 22px); }
.cs .sub2 { margin-top: 6px; color: var(--muted); max-width: 28em; }
.cs-mail small { display: block; margin-top: 8px; font-size: 12px; color: var(--faint); min-height: 1.4em; }

/* striped wipe between pages */
.stripes { position: fixed; inset: 0; z-index: 85; pointer-events: none; display: grid; grid-template-columns: repeat(5, 1fr); }
.stripes i { background: var(--blue); transform: scaleY(0); transform-origin: top; }
.stripes i:nth-child(even) { background: var(--bronze); }

/* ===== theme modes: light / gray / dark ===== */
const MODES = [["light", "Light", I.sun], ["gray", "Gray", I.half], ["dark", "Dark", I.moon]];
const Theme = (() => {
  const KEY = "gtcfc-mode";
  const listeners = [];
  let mode;
  try { mode = localStorage.getItem(KEY); } catch (e) {}
  if (!["light", "gray", "dark"].includes(mode)) {
    const host = document.documentElement.getAttribute("data-theme");
    mode = host === "dark" || (!host && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  const apply = () => {
    document.documentElement.setAttribute("data-mode", mode);
    document.querySelectorAll("[data-set-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.setMode === mode)));
    listeners.forEach((fn) => fn(mode));
  };
  apply();
  return {
    get: () => mode,
    set(m) { mode = m; try { localStorage.setItem(KEY, m); } catch (e) {} document.documentElement.classList.add("mode-anim"); apply(); setTimeout(() => document.documentElement.classList.remove("mode-anim"), 600); },
    on(fn) { listeners.push(fn); },
    refresh: apply,
    css: (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim(),

})();
const modeSwitch = (cls = "") => `<div class="modes ${cls}" role="group" aria-label="Colour mode">${MODES.map(([k, l, ic]) =>

/* ===== router with page transitions ===== */
function startApp(D) {
  const app = document.getElementById("app");
  const ROUTES = ["coming-soon", "home", "about", "regulation", "markets", "support", "open-account", "login"];
  const route = () => { const h = location.hash.replace("#", ""); return ROUTES.includes(h) ? h : "coming-soon"; };

  let pendingSec = null, first = true, busy = false, rendered = null;

  const draw = () => {
    const r = route(); rendered = r;
    app.innerHTML = r === "coming-soon" ? D.comingSoon() : r === "home" ? D.home() : PAGES[r] ? D.page(r) : D.account(r);
    scrollTo(0, 0);
    document.querySelectorAll(".pbar a").forEach((a) => a.classList.toggle("on", (a.dataset.p === "cs") === (r === "coming-soon")));

    if (D.afterRender) D.afterRender(r);
    const target = pendingSec && document.getElementById("sec-" + pendingSec); pendingSec = null;
    if (target) setTimeout(() => target.scrollIntoView({ behavior: "smooth" }), 500);
  };

  const go = async () => {
    if (busy) return; busy = true;
    if (!first && !reduce && D.leave) await D.leave();
    draw();
    if (!first && !reduce && D.enter) await D.enter();
    first = false; busy = false;
    if (route() !== rendered) go();
  };

  const wire = () => {
    const hdr = document.getElementById("hdr");
    const onS = () => { if (hdr) hdr.classList.toggle("solid", scrollY > 30); if (D.onScroll) D.onScroll(); };
    onS(); onscroll = onS;
    document.querySelectorAll("[data-set-mode]").forEach((b) => b.addEventListener("click", () => Theme.set(b.dataset.setMode)));
    document.querySelectorAll("a[data-sec]").forEach((a) => a.addEventListener("click", () => { pendingSec = a.dataset.sec; }));
    const jumps = [...document.querySelectorAll("[data-jump]")];
    jumps.forEach((b) => b.addEventListener("click", () => document.getElementById("sec-" + b.dataset.jump)?.scrollIntoView({ behavior: "smooth" })));
    if (jumps.length) {
      const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) jumps.forEach((b) => b.classList.toggle("on", "sec-" + b.dataset.jump === e.target.id)); }), { rootMargin: "-40% 0px -55% 0px" });

    }
    // reveal-on-scroll: elements start visible; the class only adds a gentle lift when they enter
    // only items below the first screen wait for the observer; everything in view is shown immediately
    const rv = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.remove("pre"); rv.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
    if (!reduce) document.querySelectorAll(".rv").forEach((el) => { if (el.getBoundingClientRect().top > innerHeight) { el.classList.add("pre"); rv.observe(el); } });
    document.getElementById("menuBtn")?.addEventListener("click", () => {
      const d = document.createElement("div"); d.className = "drawer"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "Menu");

      d.querySelectorAll("[data-set-mode]").forEach((b) => b.addEventListener("click", () => Theme.set(b.dataset.setMode)));
      const close = () => { d.classList.add("closing"); setTimeout(() => d.remove(), D.menuCloseMs || 0); };
      d.addEventListener("click", (e) => { if (e.target.closest("a") || e.target.closest("[data-close]")) close(); });
      document.body.appendChild(d); Theme.refresh();
    });
    document.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => {

    document.querySelectorAll("[data-tilt]").forEach((el) => {
      el.addEventListener("pointermove", (e) => {
        const b = el.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - 0.5, y = (e.clientY - b.top) / b.height - 0.5;

    });
  };

}

/* ===== tiny 3D helper: build lazily after first paint, pause off-screen ===== */
function lazyScene(make) {
  let inst, want, started = false;
  return {
    mount(el) {
      want = el;
      if (inst) return inst.mount(el);
      if (started || !el) return;
      started = true;
      setTimeout(() => { try { inst = window.THREE ? make() : null; } catch (e) { inst = null; } if (inst) inst.mount(want); }, 80);
    },
  };
}
function sceneHost(renderer, camera, onSize) {
  let slot = null, visible = true;
  const io = new IntersectionObserver((es) => { visible = es[0].isIntersecting; });
  const size = () => { if (!slot) return; const w = slot.clientWidth, h = slot.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; if (onSize) onSize(w, h); camera.updateProjectionMatrix(); };
  addEventListener("resize", size);
  return {
    active: () => slot && visible && !document.hidden && !window.__pause3d,
    mount(el) { io.disconnect(); slot = el; if (!el) return; el.innerHTML = ""; el.appendChild(renderer.domElement); renderer.domElement.style.cssText = "width:100%;height:100%;display:block"; io.observe(el); size(); },
  };
}

      <section class="phero"><div class="wrap"><span class="tagline fade"><i></i>${p.kicker}</span><h1>${titleLines(p.title)}</h1><p class="fade" style="animation-delay:.45s">${p.intro}</p></div></section>
      <div class="jumps"><div class="wrap">${p.sections.map((s, i) => `<button data-jump="${slug(s.t)}" class="${i === 0 ? "on" : ""}">0${i + 1} ${s.t}</button>`).join("")}</div></div>
      <div>${p.sections.map((s, i) => `<section class="psec" id="sec-${slug(s.t)}"><div class="wrap">
        <div class="lbl rv"><div class="idx">0${i + 1}</div><small>${s.t}</small></div>
        <div class="body rv"><h2>${s.lead}</h2>${s.text ? `<p>${esc(s.text)}</p>` : ""}${secBody(s)}</div></div></section>`).join("")}</div>
      ${footer()}`;
  };
  const account = (r) => {
    const a = ACCOUNT[r];
    return `${header(r)}
      <section class="phero"><div class="wrap"><span class="tagline fade"><i></i>${a.kicker}</span><h1>${titleLines(a.title)}</h1><p class="fade" style="animation-delay:.45s">${a.intro}</p>
      <div class="actions fade" style="animation-delay:.6s"><span class="badge">${SOON}</span></div><a href="#home" class="btn btn-blue fade" style="animation-delay:.7s">Back to home ${I.arrow}</a></div></section>
      <section class="psec"><div class="wrap"><div class="lbl"><div class="idx">?</div><small>Questions</small></div><div class="body"><h2>Talk to us</h2><p>Email us in the meantime.</p>${secBody({ t: "acct", contact: true })}</div></div></section>
      ${footer()}`;
  };
  const comingSoon = () => `<main class="cs">
    <div class="scene" id="sceneSlot"></div>
    <div class="cs-top fade">${logo()}${modeSwitch()}</div>
    <div class="cs-mid">
      <span class="tagline fade"><i></i>${C.domain}</span>
      <h1 style="margin-top:18px">${lines([["Coming"], ["soon.", "out"]], 0.15)}</h1>
      <div class="cs-row">
        <div class="fade" style="animation-delay:.7s"><p class="sub">We're preparing something great.</p><p class="sub2">Our new website is on its way. Thank you for your patience.</p></div>
        <div class="cs-mail fade" style="animation-delay:.85s"><button class="btn btn-blue" data-copy="csMsg" data-magnet>${I.mail} ${C.email}</button><small id="csMsg">Tap to copy the email address</small></div>
      </div>
    </div>
  </main>`;

  // striped wipe
  const stripes = [...document.querySelectorAll("#stripes i")];
  const leave = () => Promise.all(stripes.map((s, i) => new Promise((res) => { s.style.transformOrigin = "top"; const a = s.animate([{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }], { duration: 420, delay: i * 55, easing: "cubic-bezier(.76,0,.24,1)", fill: "forwards" }); a.onfinish = res; })));
  const enter = () => Promise.all(stripes.map((s, i) => new Promise((res) => { s.getAnimations().forEach((x) => x.cancel()); s.style.transformOrigin = "bottom"; const a = s.animate([{ transform: "scaleY(1)" }, { transform: "scaleY(0)" }], { duration: 480, delay: 60 + i * 55, easing: "cubic-bezier(.76,0,.24,1)", fill: "forwards" }); a.onfinish = () => { a.cancel(); res(); }; })));

  // 3D skyline: a field of bars rising and falling like a market
  const scene = lazyScene(() => {
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    const sc = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(32, 1, 0.1, 200); cam.position.set(14, 12, 14); cam.lookAt(0, 0.6, 0);
    const host = sceneHost(renderer, cam, (w) => { cam.position.setLength(w < 640 ? 25 : 22.5); cam.lookAt(0, 0.6, 0); });
    const amb = new THREE.AmbientLight(0xffffff, 0.55); sc.add(amb);
    const d1 = new THREE.DirectionalLight(0xffffff, 0.9); d1.position.set(6, 12, 4); sc.add(d1);
    const d2 = new THREE.DirectionalLight(0x8e9de0, 0.5); d2.position.set(-8, 4, -2); sc.add(d2);
    const N = 14, S = 0.62, count = N * N;
    const geo = new THREE.BoxGeometry(0.5, 1, 0.5); geo.translate(0, 0.5, 0);
    const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const mesh = new THREE.InstancedMesh(geo, mat, count); sc.add(mesh);
    const dummy = new THREE.Object3D(), col = new THREE.Color();
    const cBase = new THREE.Color(), cBlue = new THREE.Color(0x293b93), cBronze = new THREE.Color(0xb68756);
    const recolor = () => { const m = Theme.get(); cBase.set(m === "light" ? 0xdcdde2 : m === "gray" ? 0x6a6b73 : 0x26272d); };
    recolor(); Theme.on(() => setTimeout(recolor, 30));
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let last = performance.now(), t = 0;
    const loop = (now) => {
      requestAnimationFrame(loop); const dt = Math.min((now - last) / 1000, 0.05); last = now;
      if (!host.active()) return; t += dt * (reduce ? 0.15 : 1);
      let k = 0;
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        const x = (i - N / 2 + 0.5) * S, z = (j - N / 2 + 0.5) * S;
        const h = 0.25 + Math.max(0, Math.sin(i * 0.55 + t * 1.1) * 0.9 + Math.cos(j * 0.48 - t * 0.8) * 0.9 + Math.sin((i + j) * 0.3 + t * 0.6) * 0.7 + 1.1) * 0.85;
        dummy.position.set(x, 0, z); dummy.scale.set(1, h, 1); dummy.updateMatrix(); mesh.setMatrixAt(k, dummy.matrix);
        const v = (h - 0.25) / 3.2;
        if (v > 0.82) col.copy(cBronze); else if (v > 0.5) col.copy(cBase).lerp(cBlue, (v - 0.5) / 0.32); else col.copy(cBase);
        mesh.setColorAt(k, col); k++;
      }
      mesh.instanceMatrix.needsUpdate = true; if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      mesh.rotation.y += ((pointer.x * 0.35) - mesh.rotation.y) * 0.04;
      renderer.render(sc, cam);
    };
    requestAnimationFrame(loop);
    return host;
  });

  startApp({ title: "GTCFC Atlas", comingSoon, home, page, account, menu, scene, leave, enter, menuCloseMs: 430 });
})();
</script>

</html>
