<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTC Financial Consultancy LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap">
<style>
/* ---- palette: #293b93 blue · #b68756 bronze · #000 · #f2f2f2 · section greys ---- */
:root {
  --bg: #f2f2f2; --sec: #e6e6e9; --surface: #ffffff; --surface-2: #f7f7f8;
  --line: rgba(0, 0, 0, 0.1); --line-2: rgba(0, 0, 0, 0.18);
  --text: #000000; --muted: #55575e; --faint: #85878e;
  --blue: #293b93; --blue-ink: #293b93; --bronze: #b68756; --bronze-ink: #8e6338;
  --on-accent: #ffffff; --shadow: 0 24px 60px -28px rgba(18, 24, 60, 0.35);
  --head: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --wipe: cubic-bezier(.76, 0, .24, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
    --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
    --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
    --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
  --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
  --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
  --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
}
/* the page's own Light / Gray / Dark switch wins over the system setting */
:root[data-mode="light"] {
  --bg: #f2f2f2; --sec: #e6e6e9; --surface: #ffffff; --surface-2: #f7f7f8;
  --line: rgba(0, 0, 0, 0.1); --line-2: rgba(0, 0, 0, 0.18);
  --text: #000000; --muted: #55575e; --faint: #85878e;
  --blue-ink: #293b93; --bronze-ink: #8e6338; --shadow: 0 24px 60px -28px rgba(18, 24, 60, 0.35); color-scheme: light;
}
:root[data-mode="gray"] {
  --bg: #3a3b40; --sec: #44454b; --surface: #4e4f56; --surface-2: #57585f;
  --line: rgba(255, 255, 255, 0.12); --line-2: rgba(255, 255, 255, 0.22);
  --text: #f2f2f2; --muted: #c8c9ce; --faint: #9c9da4;
  --blue-ink: #b3bff5; --bronze-ink: #ddb184; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.6); color-scheme: dark;
}
:root[data-mode="dark"] {
  --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
  --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
  --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
  --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { height: 100%; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }
.mode-anim body, .mode-anim body * { transition: background-color .5s ease, color .5s ease, border-color .5s ease, fill .5s ease !important; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--head); letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 3px; border-radius: 6px; }
.w { display: inline-block; white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* motion primitives (all end visible) */
.rise { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .06em; }
.rise > span { display: inline-block; animation: rise .95s var(--ease) both; }
@keyframes rise { from { transform: translateY(112%); } to { transform: none; } }
.fade { animation: fade .9s var(--ease) both; }
@keyframes fade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.rv { transition: opacity .9s var(--ease), transform .9s var(--ease); }
.rv.pre { opacity: 0; transform: translateY(28px); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* Layout: Prism — centred composition. Name on top, a faceted 3D gem in the middle, a gradient headline below, soft colour glow behind */
.page { position: relative; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 12px; padding: 32px 16px 44px; overflow: hidden; text-align: center; }
.glow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.glow i { position: absolute; width: 52vmax; height: 52vmax; border-radius: 50%; filter: blur(100px); opacity: .22; }
.glow i:nth-child(1) { background: var(--blue); left: -18vmax; top: -22vmax; animation: m1 22s ease-in-out infinite; }
.glow i:nth-child(2) { background: var(--bronze); right: -18vmax; bottom: -24vmax; animation: m2 26s ease-in-out infinite; }
:root[data-mode="light"] .glow i { opacity: .15; }
@media (prefers-color-scheme: light) { :root:not([data-mode]) .glow i { opacity: .15; } }
@keyframes m1 { 50% { transform: translate(10vmax, 8vmax); } }
@keyframes m2 { 50% { transform: translate(-10vmax, -6vmax); } }
.bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; width: 100%; height: 100%; }
.spot { position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(500px circle at var(--mx, 50%) var(--my, 40%), color-mix(in srgb, var(--bronze) 12%, transparent), transparent 60%); }
.dots { position: fixed; inset: 0; pointer-events: none; z-index: 0; background-image: radial-gradient(var(--line-2) 1px, transparent 1.2px); background-size: 28px 28px; -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%); mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%); }
.page > * { position: relative; z-index: 1; }

/* logo lockup */
.lockup { display: inline-flex; align-items: center; gap: 14px; padding: 10px 20px 10px 12px; border-radius: 18px; background: color-mix(in srgb, var(--surface) 70%, transparent); border: 1px solid var(--line); backdrop-filter: blur(12px); animation: fade .9s .1s var(--ease) both; }
.lockup svg { width: 52px; height: 52px; flex: none; }
.lockup svg path { transform-origin: 20px 20px; animation: facet .7s var(--ease) both; }
.lockup svg path:nth-child(1) { animation-delay: .25s; } .lockup svg path:nth-child(2) { animation-delay: .35s; } .lockup svg path:nth-child(3) { animation-delay: .45s; }
.lockup svg path:nth-child(4) { animation-delay: .55s; } .lockup svg path:nth-child(5) { animation-delay: .65s; } .lockup svg path:nth-child(6) { animation-delay: .75s; }
@keyframes facet { from { transform: scale(.2) rotate(-30deg); opacity: 0; } }
.lockup .nm { font-family: var(--head); font-weight: 600; font-size: clamp(17px, 2.1vw, 24px); letter-spacing: -0.01em; text-align: left; line-height: 1.2; }
.lockup .nm span { color: var(--bronze-ink); }
@media (max-width: 520px) { .lockup .nm { max-width: 11em; } }

/* gem */
.gem { position: relative; width: min(520px, 100%); height: clamp(220px, 38vh, 400px); }
.gem .scene { position: absolute; inset: 0; opacity: 0; transform: scale(.85); transition: opacity 1.2s ease, transform 1.6s var(--ease); }
.gem .scene.ready { opacity: 1; transform: none; }
.gem::before { content: ""; position: absolute; left: 50%; top: 50%; width: 72%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid var(--line); animation: pulse 4s ease-in-out infinite; }
.gem::after { content: ""; position: absolute; left: 50%; top: 50%; width: 92%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 1px dashed var(--line); animation: spin 60s linear infinite; }
@keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.06); opacity: .5; } }
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

/* headline */
.chip { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 12px; border-radius: 999px; background: linear-gradient(100deg, var(--blue), color-mix(in srgb, var(--blue) 55%, var(--bronze))); color: #fff; padding: clamp(12px, 1.3vw, 18px) clamp(22px, 2.4vw, 34px) clamp(12px, 1.3vw, 18px) clamp(18px, 1.8vw, 22px); font-family: var(--head); font-size: clamp(17px, 1.9vw, 22px); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; box-shadow: 0 16px 40px -16px color-mix(in srgb, var(--blue) 85%, transparent); animation: popIn .8s .4s var(--ease) both; }
.chip::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: shine 3.2s 1.4s ease-in-out infinite; }
.chip i { width: 12px; height: 12px; border-radius: 50%; background: var(--bronze); animation: ping 2s ease-out infinite; }
@keyframes shine { 0% { transform: translateX(-120%) skewX(-20deg); } 60%, 100% { transform: translateX(320%) skewX(-20deg); } }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); } 70%, 100% { box-shadow: 0 0 0 10px rgba(255,255,255,0); } }
@keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.92); } to { opacity: 1; transform: none; } }
.h1 { margin-top: 22px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.26; font-size: clamp(34px, 5.2vw, 55px); }
.ch { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .06em; }
.ch > span { display: inline-block; animation: rise 1s var(--ease) both; }
.sp { display: inline-block; width: .26em; }
.g2 { background: linear-gradient(100deg, var(--blue-ink), var(--bronze)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { margin: 18px auto 0; max-width: 34em; font-size: clamp(16px, 1.4vw, 18px); color: var(--muted); animation: fade .9s 1.2s var(--ease) both; }
.bar { display: flex; justify-content: center; gap: 6px; margin-top: 26px; }
.bar i { width: 34px; height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; position: relative; }
.bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--blue-ink), var(--bronze)); transform: scaleX(0); transform-origin: left; animation: fill 3s ease-in-out infinite; }
.bar i:nth-child(2)::after { animation-delay: .4s; } .bar i:nth-child(3)::after { animation-delay: .8s; } .bar i:nth-child(4)::after { animation-delay: 1.2s; }
@keyframes fill { 0% { transform: scaleX(0); transform-origin: left; } 45% { transform: scaleX(1); transform-origin: left; } 55% { transform: scaleX(1); transform-origin: right; } 100% { transform: scaleX(0); transform-origin: right; } }
</style>

<div class="glow" aria-hidden="true"><i></i><i></i></div>
<canvas class="bgfx" id="bgfx" aria-hidden="true"></canvas>
<div class="dots" aria-hidden="true"></div>
<div class="spot" id="spot" aria-hidden="true"></div>
<main class="page">
  <div class="lockup" aria-label="GTC Financial Consultancy LLC">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 3 34.7 11.5 20 20Z" fill="var(--blue)"/><path d="M34.7 11.5V28.5L20 20Z" fill="var(--bronze)"/>
      <path d="M34.7 28.5 20 37V20Z" fill="var(--blue)" opacity=".75"/><path d="M20 37 5.3 28.5 20 20Z" fill="var(--bronze)" opacity=".8"/>
      <path d="M5.3 28.5V11.5L20 20Z" fill="var(--blue)" opacity=".9"/><path d="M5.3 11.5 20 3V20Z" fill="var(--bronze)" opacity=".6"/>
    </svg>
    <div class="nm">GTC Financial <span>Consultancy LLC</span></div>
  </div>
  <div class="gem" aria-hidden="true"><div class="scene" id="scene"></div></div>
  <div>
    <span class="chip"><i></i>Coming Soon</span>
    <h1 class="h1" id="h1">We're preparing something great.</h1>
    <p class="lead">A new experience from GTC Financial Consultancy LLC is on its way. We're putting on the finishing touches.</p>
    <div class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
/* ===== shared helpers for the single-screen Coming Soon pages ===== */
const NAME = "GTC Financial Consultancy LLC";
// Colour mode follows the visitor's device. For previews, #light, #gray or #dark in the link forces a mode.
const Theme = (() => {
  const listeners = [];
  const media = matchMedia("(prefers-color-scheme: dark)");
  const forced = () => { const h = location.hash.replace("#", ""); return ["light", "gray", "dark"].includes(h) ? h : null; };
  const get = () => {
    const f = forced(); if (f) return f;
    const host = document.documentElement.getAttribute("data-theme");
    if (host === "dark" || host === "light") return host;
    return media.matches ? "dark" : "light";
  };
  const apply = () => {
    const f = forced();
    if (f) document.documentElement.setAttribute("data-mode", f); else document.documentElement.removeAttribute("data-mode");
    listeners.forEach((fn) => fn(get()));
  };
  media.addEventListener?.("change", apply);
  addEventListener("hashchange", apply);
  new MutationObserver(() => listeners.forEach((fn) => fn(get()))).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  apply();
  return { get, on: (fn) => listeners.push(fn), css: (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim() };
})();
const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
addEventListener("pointermove", (e) => { pointer.tx = (e.clientX / innerWidth) * 2 - 1; pointer.ty = -(e.clientY / innerHeight) * 2 + 1; });
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
// split text into letters that rise in one by one
const letters = (text, delay = 0, step = 0.045, cls = "") => {
  let i = 0;
  return text.split(" ").map((w) => `<span class="w">${w.split("").map((ch) => `<span class="ch"><span class="${cls}" style="animation-delay:${(delay + i++ * step).toFixed(3)}s">${ch}</span></span>`).join("")}</span>`).join('<span class="sp"> </span>');
};
// words rise one after another (for sentence headlines)
const wordsUp = (text, delay = 0, step = 0.08, cls = "") => text.split(" ").map((w, i) =>
  `<span class="ch"><span class="${cls}" style="animation-delay:${(delay + i * step).toFixed(2)}s">${w}</span></span>`).join(" ");
// build the 3D scene after first paint; pause it when hidden
function scene3d(slot, make) {
  if (!slot) return;
  setTimeout(() => {
    if (!window.THREE) return;
    let api; try { api = make(); } catch (e) { return; }
    const { renderer, camera, tick, onSize } = api;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    slot.appendChild(renderer.domElement);
    renderer.domElement.style.cssText = "width:100%;height:100%;display:block";
    let visible = true;
    new IntersectionObserver((es) => { visible = es[0].isIntersecting; }).observe(slot);
    const size = () => { const w = slot.clientWidth, h = slot.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; if (onSize) onSize(w, h); camera.updateProjectionMatrix(); };
    size(); addEventListener("resize", size);
    let last = performance.now(), t = 0;
    const loop = (now) => {
      requestAnimationFrame(loop);
      const dt = Math.min((now - last) / 1000, 0.05); last = now;
      if (!visible || document.hidden || window.__pause3d) return;
      t += dt * (reduceMotion ? 0.15 : 1);
      pointer.x += (pointer.tx - pointer.x) * 0.05; pointer.y += (pointer.ty - pointer.y) * 0.05;
      tick(t, dt);
    };
    requestAnimationFrame(loop);
    slot.classList.add("ready");
  }, 60);
}

  document.getElementById("h1").innerHTML = wordsUp("We're preparing", 0.55) + "<br>" + wordsUp("something great.", 0.75, 0.1, "g2");

  // whole-page background: drifting facets linked by fine lines, gently pulled toward the cursor
  (() => {
    const cv = document.getElementById("bgfx"), ctx = cv.getContext("2d");
    let W = 0, H = 0, dpr = 1, nodes = [], mx = -9999, my = -9999;
    const make = () => {
      dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(Math.min(90, (W * H) / 16000));
      nodes = Array.from({ length: n }, (_, i) => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25, r: 3 + Math.random() * 6, a: Math.random() * Math.PI * 2, va: (Math.random() - 0.5) * 0.01, k: i % 3 }));
    };
    make(); addEventListener("resize", make);
    addEventListener("pointermove", (e) => { mx = e.clientX; my = e.clientY; });
    const shape = (x, y, r, a, sides) => { ctx.beginPath(); for (let i = 0; i <= sides; i++) { const t = a + (i / sides) * Math.PI * 2; ctx[i ? "lineTo" : "moveTo"](x + Math.cos(t) * r, y + Math.sin(t) * r); } };
    let blue, bronze, line;
    const colors = () => { blue = Theme.css("--blue-ink") || "#293b93"; bronze = "#b68756"; line = Theme.css("--text") || "#000"; };
    colors(); Theme.on(() => setTimeout(colors, 30));
    const step = () => {
      requestAnimationFrame(step);
      if (document.hidden) return;
      ctx.clearRect(0, 0, W, H);
      const sp = reduceMotion ? 0.15 : 1;
      for (const p of nodes) {
        const dx = mx - p.x, dy = my - p.y, d2 = dx * dx + dy * dy;
        if (d2 < 40000) { p.vx += dx * 0.000012; p.vy += dy * 0.000012; }
        p.vx *= 0.995; p.vy *= 0.995;
        p.x += p.vx * sp + Math.sin(p.a) * 0.05; p.y += p.vy * sp + Math.cos(p.a) * 0.05; p.a += p.va * sp;
        if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20; if (p.y < -20) p.y = H + 20; if (p.y > H + 20) p.y = -20;
      }
      ctx.lineWidth = 1;
      for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
        if (d < 150) { ctx.globalAlpha = (1 - d / 150) * 0.22; ctx.strokeStyle = (i + j) % 2 ? blue : bronze; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      }
      for (const p of nodes) {
        const near = Math.hypot(mx - p.x, my - p.y) < 160;
        ctx.globalAlpha = near ? 0.75 : 0.42;
        if (p.k === 0) { shape(p.x, p.y, p.r, p.a, 3); ctx.fillStyle = bronze; ctx.fill(); }
        else if (p.k === 1) { shape(p.x, p.y, p.r, p.a, 6); ctx.strokeStyle = blue; ctx.lineWidth = 1.2; ctx.stroke(); }
        else { ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2); ctx.fillStyle = line; ctx.fill(); }
      }
      ctx.globalAlpha = 1;
    };
    requestAnimationFrame(step);
  })();
  const spot = document.getElementById("spot");
  addEventListener("pointermove", (e) => { spot.style.setProperty("--mx", e.clientX + "px"); spot.style.setProperty("--my", e.clientY + "px"); });

  scene3d(document.getElementById("scene"), () => {
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    const sc = new THREE.Scene(), camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100); camera.position.set(0, 0, 7.4);
    const amb = new THREE.AmbientLight(0xffffff, 0.45); sc.add(amb);
    const lb = new THREE.DirectionalLight(0x4a5fd0, 1.5); lb.position.set(-4, 2, 3); sc.add(lb);
    const lz = new THREE.DirectionalLight(0xd9a46e, 1.6); lz.position.set(4, -1, 3); sc.add(lz);
    const lw = new THREE.DirectionalLight(0xffffff, 0.5); lw.position.set(0, 4, 2); sc.add(lw);
    const g = new THREE.Group(); sc.add(g);
    const mat = new THREE.MeshLambertMaterial({ color: 0xcfd2db, flatShading: true });
    const gem = new THREE.Mesh(new THREE.IcosahedronGeometry(1.35, 0), mat); g.add(gem);
    gem.add(new THREE.LineSegments(new THREE.EdgesGeometry(gem.geometry), new THREE.LineBasicMaterial({ color: 0xb68756 })));
    const shellMat = new THREE.LineBasicMaterial({ color: 0x293b93, transparent: true, opacity: 0.35 });
    const shell = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(2.05, 1)), shellMat); g.add(shell);
    const bits = [];
    for (let i = 0; i < 10; i++) {
      const m = new THREE.Mesh(new THREE.TetrahedronGeometry(0.11 + (i % 3) * 0.04, 0), new THREE.MeshLambertMaterial({ color: i % 2 ? 0xb68756 : 0x293b93, flatShading: true }));
      g.add(m); bits.push({ m, r: 2.3 + (i % 3) * 0.3, sp: 0.22 + i * 0.035, ph: i * 0.7, y: ((i * 37) % 10) / 10 - 0.5 });
    }
    const recolor = () => {
      const mode = Theme.get();
      mat.color.set(mode === "light" ? 0xcfd2db : mode === "gray" ? 0x8b8d96 : 0x2a2c33);
      amb.intensity = mode === "light" ? 0.55 : 0.4;
      shellMat.color.set(Theme.css("--blue-ink") || "#293b93");
    };
    recolor(); Theme.on(() => setTimeout(recolor, 30));
    let intro = 0; const t0 = performance.now();
    return {
      renderer, camera,
      tick(t, dt) {
        intro = Math.min(1, (performance.now() - t0) / 2000); const e = 1 - Math.pow(1 - intro, 4);
        gem.rotation.set(t * 0.25, t * 0.35 + (1 - e) * 3, 0); shell.rotation.set(-t * 0.08, t * 0.1, 0);
        gem.position.y = Math.sin(t * 1.3) * 0.08; gem.scale.setScalar(0.4 + 0.6 * e); shell.scale.setScalar(0.7 + 0.3 * e);
        bits.forEach(({ m, r, sp, ph, y }) => { const a = t * sp + ph; m.position.set(Math.cos(a) * r * e, y * 1.6 + Math.sin(t + ph) * 0.15, Math.sin(a) * r * 0.6); m.rotation.x += dt; m.rotation.y += dt * 0.7; });
        g.rotation.y = pointer.x * 0.5; g.rotation.x = -pointer.y * 0.3;
        renderer.render(sc, camera);
      },
    };
  });
})();
