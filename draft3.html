<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTCFC Draft 3</title>
<link rel="icon" href="https://www.gtcfx.com/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* ---- palette: #293b93 blue · #b68756 bronze · #000 · #f2f2f2 · section greys ---- */
:root {
  --bg: #f2f2f2; --sec: #e6e6e9; --surface: #ffffff; --surface-2: #f7f7f8;
  --line: rgba(0, 0, 0, 0.1); --line-2: rgba(0, 0, 0, 0.18);
  --text: #000000; --muted: #55575e; --faint: #85878e;
  --blue: #293b93; --blue-ink: #293b93; --bronze: #b68756; --bronze-ink: #8e6338;
  --on-accent: #ffffff; --shadow: 0 24px 60px -28px rgba(18, 24, 60, 0.35);
  --head: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --wipe: cubic-bezier(.76, 0, .24, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
    --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
    --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
    --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
  --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
  --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
  --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
}
/* the page's own Light / Gray / Dark switch wins over the system setting */
:root[data-mode="light"] {
  --bg: #f2f2f2; --sec: #e6e6e9; --surface: #ffffff; --surface-2: #f7f7f8;
  --line: rgba(0, 0, 0, 0.1); --line-2: rgba(0, 0, 0, 0.18);
  --text: #000000; --muted: #55575e; --faint: #85878e;
  --blue-ink: #293b93; --bronze-ink: #8e6338; --shadow: 0 24px 60px -28px rgba(18, 24, 60, 0.35); color-scheme: light;
}
:root[data-mode="gray"] {
  --bg: #3a3b40; --sec: #44454b; --surface: #4e4f56; --surface-2: #57585f;
  --line: rgba(255, 255, 255, 0.12); --line-2: rgba(255, 255, 255, 0.22);
  --text: #f2f2f2; --muted: #c8c9ce; --faint: #9c9da4;
  --blue-ink: #b3bff5; --bronze-ink: #ddb184; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.6); color-scheme: dark;
}
:root[data-mode="dark"] {
  --bg: #000000; --sec: #0e0f12; --surface: #16171b; --surface-2: #1d1e23;
  --line: rgba(255, 255, 255, 0.1); --line-2: rgba(255, 255, 255, 0.2);
  --text: #f2f2f2; --muted: #a1a3aa; --faint: #6f7178;
  --blue-ink: #8f9ff2; --bronze-ink: #cfa072; --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9); color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }
.mode-anim body, .mode-anim body * { transition: background-color .5s ease, color .5s ease, border-color .5s ease, fill .5s ease !important; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--head); letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* motion primitives (all end visible) */
.rise { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .06em; }
.rise > span { display: inline-block; animation: rise .95s var(--ease) both; }
@keyframes rise { from { transform: translateY(112%); } to { transform: none; } }
.fade { animation: fade .9s var(--ease) both; }
@keyframes fade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.rv { transition: opacity .9s var(--ease), transform .9s var(--ease); }
.rv.pre { opacity: 0; transform: translateY(28px); }

/* Light / Gray / Dark switch */
.modes { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.modes button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--muted); transition: background .3s, color .3s; }
.modes button svg { width: 15px; height: 15px; }
.modes button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.modes.compact span { display: none; }

/* preview bar */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* Layout: Prism — centred hero around a faceted 3D gem, bento tiles that tilt, soft blur-and-scale between pages */
.wrap { width: 100%; max-width: 1180px; margin-inline: auto; padding-inline: 16px; }
@media (min-width: 640px) { .wrap { padding-inline: 24px; } }
.mesh { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.mesh i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(90px); opacity: .22; }
.mesh i:nth-child(1) { background: var(--blue); left: -14vmax; top: -18vmax; animation: m1 24s ease-in-out infinite; }
.mesh i:nth-child(2) { background: var(--bronze); right: -16vmax; top: 20vh; animation: m2 28s ease-in-out infinite; }
:root[data-mode="light"] .mesh i { opacity: .16; }
@keyframes m1 { 50% { transform: translate(8vmax, 6vmax); } }
@keyframes m2 { 50% { transform: translate(-8vmax, -4vmax); } }
#app { position: relative; z-index: 1; }

/* logo: faceted hexagon gem */
.logo { display: inline-flex; align-items: center; max-width: 100%; }
.logo-img { display: block; height: 34px; width: auto; max-width: min(200px, 48vw); object-fit: contain; object-position: left center; }
@media (min-width: 640px) { .logo-img { height: 40px; max-width: 240px; } }
.logo-img--lg { height: 56px; max-width: 280px; }

/* header */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; padding-top: 12px; }
.hbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; padding: 0 10px 0 18px; border-radius: 20px; border: 1px solid transparent; transition: background .4s, border-color .4s, box-shadow .4s; }
.hdr.solid .hbar { background: color-mix(in srgb, var(--surface) 86%, transparent); border-color: var(--line); backdrop-filter: blur(18px); box-shadow: var(--shadow); }
.tabs { display: none; position: relative; padding: 4px; border-radius: 14px; background: var(--sec); }
.tabs a { position: relative; z-index: 1; padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--muted); transition: color .3s; }
.tabs a.active, .tabs a:hover { color: var(--text); }
.tabs .ind { position: absolute; z-index: 0; top: 4px; bottom: 4px; border-radius: 10px; background: var(--surface); box-shadow: 0 2px 10px rgba(0,0,0,.08); transition: left .45s var(--ease), width .45s var(--ease), opacity .3s; opacity: 0; }
.hright { display: none; align-items: center; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 14px; padding: 12px 20px; font-size: 14px; font-weight: 600; border: 1px solid transparent; cursor: pointer; background: none; transition: transform .25s var(--ease), background .3s, color .3s, border-color .3s; }
.btn svg { width: 16px; height: 16px; }
.btn-blue { background: var(--blue); color: #fff; }
.btn-blue:hover { background: #1f2d75; }
.btn-bronze { background: var(--bronze); color: #fff; }
.btn-bronze:hover { background: #9c7044; }
.btn-soft { background: var(--sec); color: var(--text); }
.btn-soft:hover { background: var(--surface-2); }
.sq { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 0; background: var(--sec); cursor: pointer; }
.sq svg { width: 20px; height: 20px; }
@media (min-width: 1024px) { .tabs, .hright { display: flex; } #menuBtn { display: none; } }
.drawer { position: fixed; inset: 0; z-index: 70; padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 12px; background: rgba(0,0,0,.3); backdrop-filter: blur(6px); animation: fade .3s ease both; }
.drawer .card2 { border-radius: 24px; background: var(--surface); border: 1px solid var(--line); padding: 16px; display: grid; gap: 14px; box-shadow: var(--shadow); animation: drop .5s var(--ease) both; transform-origin: top; }
@keyframes drop { from { opacity: 0; transform: translateY(-14px) scale(.97); } }
.drawer.closing { animation: fadeOut .3s ease both; }
@keyframes fadeOut { to { opacity: 0; } }
.drawer .top { display: flex; justify-content: space-between; align-items: center; }
.drawer nav { display: grid; gap: 4px; }
.drawer nav a { padding: 14px 16px; border-radius: 14px; background: var(--sec); font-weight: 500; }

/* hero */
.hero { position: relative; text-align: center; padding-block: 8px 64px; }
.gem { position: relative; height: clamp(220px, 30vw, 340px); max-width: 640px; margin-inline: auto; }
.gem .scene { position: absolute; inset: 0; }
.chip { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; background: var(--sec); padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--muted); }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--bronze); animation: blink 1.8s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.h1 { margin-top: 18px; font-weight: 700; line-height: 1.02; font-size: clamp(40px, 6.6vw, 84px); letter-spacing: -0.04em; }
.grad { background: linear-gradient(100deg, var(--blue-ink) 0%, var(--bronze) 85%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { margin: 20px auto 0; max-width: 34em; font-size: 18px; color: var(--muted); }
.actions { margin-top: 32px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

/* bento */
.bento { display: grid; gap: 14px; padding-bottom: 96px; }
@media (min-width: 768px) { .bento { grid-template-columns: repeat(6, 1fr); } .t-a { grid-column: span 4; } .t-b { grid-column: span 2; } .t-c, .t-d, .t-e { grid-column: span 2; } }
.tile { position: relative; overflow: hidden; border-radius: 26px; background: var(--surface); border: 1px solid var(--line); padding: 28px; min-height: 190px; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; transition: transform .25s ease-out, box-shadow .4s; will-change: transform; }
.tile::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; background: radial-gradient(360px circle at var(--x, 50%) var(--y, 50%), color-mix(in srgb, var(--bronze) 18%, transparent), transparent 60%); }
.tile:hover { box-shadow: var(--shadow); }
.tile:hover::before { opacity: 1; }
.tile > * { position: relative; }
.tile small { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--bronze-ink); }
.tile h3 { font-size: 24px; font-weight: 600; }
.tile p { color: var(--muted); font-size: 15px; }
.t-a { background: var(--blue); color: #fff; border-color: transparent; }
.t-a small { color: #e2c49f; }
.t-a p { color: rgba(255,255,255,.75); }
.t-a h3 { font-size: clamp(28px, 3.4vw, 40px); }
.facets { position: absolute; right: -40px; bottom: -60px; width: 260px; height: 260px; opacity: .35; animation: spin 40s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.t-b { background: var(--sec); }
.big-num { font-family: var(--head); font-weight: 700; font-size: 64px; line-height: 1; letter-spacing: -0.04em; }
.copyrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.copyrow small { letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--faint); min-height: 1.4em; }

/* nav panel */
.npanel { border-radius: 30px; background: var(--sec); padding: clamp(14px, 2.6vw, 24px); }
.np-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 4px 18px; }
.pill { border-radius: 999px; background: var(--surface); padding: 6px 14px; font-size: 13px; font-weight: 500; }
.np-grid { display: grid; gap: 12px; }
@media (min-width: 640px) { .np-grid { grid-template-columns: 1fr 1fr; } }
.ncard { border-radius: 20px; background: var(--surface); padding: 24px; transition: transform .25s ease-out, box-shadow .3s; }
.ncard:hover { box-shadow: var(--shadow); }
.ncard h3 { font-size: 21px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.go { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--sec); transition: background .3s, color .3s, transform .4s var(--ease); flex: none; }
.go svg { width: 16px; height: 16px; }
.ncard:hover .go { background: var(--bronze); color: #fff; transform: rotate(-45deg); }
.ncard p { margin-top: 8px; font-size: 15px; color: var(--muted); }
.ncard p a:hover { color: var(--text); }
.nact { display: flex; flex-direction: column; align-items: center; gap: 8px; border-radius: 20px; border: 1.5px dashed var(--line-2); padding: 28px 12px; text-align: center; transition: border-color .3s, background .3s; }
.nact:hover { border-color: var(--blue-ink); background: var(--surface); }
.nact svg { width: 28px; height: 28px; color: var(--blue-ink); }
.nact strong { font-family: var(--head); font-weight: 600; }
.nact small { font-size: 12px; color: var(--faint); }
.sect { padding-bottom: 110px; }
.sect h2 { font-size: clamp(30px, 4vw, 48px); font-weight: 700; letter-spacing: -0.035em; text-align: center; }
.sect > .wrap > p { margin: 10px auto 34px; text-align: center; max-width: 30em; color: var(--muted); }

/* inner pages */
.phero { display: grid; gap: 28px; align-items: center; padding-block: 56px 40px; }
@media (min-width: 900px) { .phero { grid-template-columns: 1.4fr 1fr; } }
.phero h1 { margin-top: 16px; font-weight: 700; letter-spacing: -0.04em; font-size: clamp(40px, 6vw, 76px); line-height: 1.02; }
.phero p { margin-top: 18px; max-width: 32em; font-size: 18px; color: var(--muted); }
.hex { justify-self: center; width: min(320px, 70vw); aspect-ratio: 1; animation: float 7s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-12px) rotate(4deg); } }
.chips { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); z-index: 20; display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 16px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all .3s var(--ease); }
.chips button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.pgrid { display: grid; gap: 14px; padding-bottom: 110px; }
.psec { border-radius: 28px; background: var(--surface); border: 1px solid var(--line); padding: clamp(22px, 4vw, 38px); scroll-margin-top: 160px; }
.psec:nth-child(even) { background: var(--sec); }
.psec .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 10px; }
.psec small { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--bronze-ink); }
.psec h2 { margin-top: 8px; font-size: clamp(24px, 3vw, 34px); font-weight: 700; letter-spacing: -0.03em; }
.psec > p { margin-top: 8px; color: var(--muted); max-width: 40em; }
.cards { display: grid; gap: 12px; margin-top: 24px; }
@media (min-width: 640px) { .cards.n2, .cards.n4 { grid-template-columns: 1fr 1fr; } .cards.n3 { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1024px) { .cards.n4 { grid-template-columns: repeat(4, 1fr); } }
.card { border-radius: 18px; background: var(--bg); padding: 20px; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; transition: transform .25s ease-out; }
.psec:nth-child(even) .card { background: var(--surface); }
.card h3 { font-size: 17px; font-weight: 600; }
.badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue-ink); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--bronze); animation: blink 1.8s ease-in-out infinite; }
.plain { color: var(--muted); font-size: 14px; }
.list { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 8px; }
@media (min-width: 640px) { .list { grid-template-columns: 1fr 1fr; } }
.list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-radius: 14px; background: var(--bg); padding: 14px 16px; font-weight: 500; font-size: 15px; }
.psec:nth-child(even) .list li { background: var(--surface); }
.faq { margin-top: 20px; display: grid; gap: 8px; }
.faq details { border-radius: 14px; background: var(--bg); }
.psec:nth-child(even) .faq details { background: var(--surface); }
.faq summary { list-style: none; cursor: pointer; padding: 16px 18px; font-weight: 500; display: flex; justify-content: space-between; gap: 14px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px; background: var(--sec); font-size: 16px; line-height: 1; transition: transform .3s; flex: none; }
.faq details[open] summary::after { transform: rotate(45deg); background: var(--bronze); color: #fff; }
.faq details p { padding: 0 18px 16px; color: var(--muted); animation: fade .4s var(--ease) both; }
.contact { margin-top: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.contact .mail { font-family: var(--head); font-weight: 600; font-size: clamp(19px, 2.4vw, 26px); }
.contact small { font-size: 13px; color: var(--faint); min-height: 1.4em; }

/* footer */
.footer { padding-bottom: 96px; }
.fbox { border-radius: 30px; background: var(--sec); padding: clamp(24px, 4vw, 40px); display: grid; gap: 28px; }
.ftop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px; }
.flinks { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: var(--muted); }
.flinks a:hover { color: var(--text); }
.fbase { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }

/* coming soon */
.cs { min-height: 100vh; display: flex; flex-direction: column; }
.cs-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 22px 16px; }
@media (min-width: 640px) { .cs-top { padding-inline: 32px; } }
.cs-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 16px; }
.cs .gem { width: 100%; height: clamp(240px, 38vh, 380px); }
.cs h1 { font-weight: 700; letter-spacing: -0.05em; line-height: .95; font-size: clamp(56px, 10vw, 128px); }
.cs .sub { margin-top: 18px; font-family: var(--head); font-weight: 500; font-size: clamp(19px, 2.4vw, 26px); }
.cs .sub2 { margin-top: 8px; color: var(--muted); max-width: 30em; }
.cs .row { margin-top: 26px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
.cs .row small { width: 100%; font-size: 13px; color: var(--faint); min-height: 1.4em; }
.ticker { margin-top: 28px; border-top: 1px solid var(--line); overflow: hidden; padding-block: 16px 84px; }
.ticker .track { display: flex; width: max-content; animation: tick 30s linear infinite; }
.ticker span { display: inline-flex; align-items: center; gap: 28px; padding-right: 28px; font-family: var(--head); font-weight: 600; font-size: 15px; color: var(--faint); letter-spacing: .02em; }
.ticker span::after { content: ""; width: 8px; height: 8px; transform: rotate(45deg); background: var(--bronze); }
@keyframes tick { to { transform: translateX(-50%); } }
</style>

<div class="mesh" aria-hidden="true"><i></i><i></i></div>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
/* ===== shared content, themes, router and page transitions for the v2 drafts ===== */
const C = {
  name: "GTC Financial Consultancy LLC", short: "GTCFC", domain: "GTCFC.com",
  city: "Dubai, United Arab Emirates", email: "info@gtcfc.com",
};
const NAV = [
  { t: "About Us", r: "about", items: ["Company", "Group", "Contact"] },

const MODES = [["light", "Light", I.sun], ["gray", "Gray", I.half], ["dark", "Dark", I.moon]];
const Theme = (() => {
  const KEY = "gtcfc-mode";
  const listeners = [];
  let mode;
  try { mode = localStorage.getItem(KEY); } catch (e) {}
  if (!["light", "gray", "dark"].includes(mode)) {
    const host = document.documentElement.getAttribute("data-theme");
    mode = host === "dark" || (!host && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  const apply = () => {
    document.documentElement.setAttribute("data-mode", mode);
    document.querySelectorAll("[data-set-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.setMode === mode)));
    listeners.forEach((fn) => fn(mode));
  };
  apply();
  return {
    get: () => mode,
    set(m) { mode = m; try { localStorage.setItem(KEY, m); } catch (e) {} document.documentElement.classList.add("mode-anim"); apply(); setTimeout(() => document.documentElement.classList.remove("mode-anim"), 600); },
    on(fn) { listeners.push(fn); },
    refresh: apply,
    css: (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim(),
  };
})();

function startApp(D) {
  const app = document.getElementById("app");
  const ROUTES = ["coming-soon", "home", "about", "regulation", "markets", "support", "open-account", "login"];
  const route = () => { const h = location.hash.replace("#", ""); return ROUTES.includes(h) ? h : "home"; };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let pendingSec = null, first = true, busy = false, rendered = null;

  const draw = () => {
    const r = route(); rendered = r;
    app.innerHTML = r === "coming-soon" ? D.comingSoon() : r === "home" ? D.home() : PAGES[r] ? D.page(r) : D.account(r);
    scrollTo(0, 0);
    const t = r === "home" ? "Home" : r === "coming-soon" ? "" : (PAGES[r] || ACCOUNT[r]).kicker;
    document.title = t ? `${t} · ${D.title}` : D.title;
    if (D.scene) D.scene.mount(document.getElementById("sceneSlot"));
    wire();
    Theme.refresh();
    if (D.afterRender) D.afterRender(r);
    const target = pendingSec && document.getElementById("sec-" + pendingSec); pendingSec = null;
    if (target) setTimeout(() => target.scrollIntoView({ behavior: "smooth" }), 500);
  };

  const go = async () => {
    if (busy) return; busy = true;
    if (!first && !reduce && D.leave) await D.leave();
    draw();
    if (!first && !reduce && D.enter) await D.enter();
    first = false; busy = false;
    if (route() !== rendered) go();
  };

  const wire = () => {
    const hdr = document.getElementById("hdr");
    const onS = () => { if (hdr) hdr.classList.toggle("solid", scrollY > 30); if (D.onScroll) D.onScroll(); };
    onS(); onscroll = onS;
    document.querySelectorAll("[data-set-mode]").forEach((b) => b.addEventListener("click", () => Theme.set(b.dataset.setMode)));
    document.querySelectorAll("a[data-sec]").forEach((a) => a.addEventListener("click", () => { pendingSec = a.dataset.sec; }));
    const jumps = [...document.querySelectorAll("[data-jump]")];
    jumps.forEach((b) => b.addEventListener("click", () => document.getElementById("sec-" + b.dataset.jump)?.scrollIntoView({ behavior: "smooth" })));
    if (jumps.length) {
      const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) jumps.forEach((b) => b.classList.toggle("on", "sec-" + b.dataset.jump === e.target.id)); }), { rootMargin: "-40% 0px -55% 0px" });
      document.querySelectorAll(".psec").forEach((s) => io.observe(s));
    }
    // reveal-on-scroll: elements start visible; the class only adds a gentle lift when they enter
    // only items below the first screen wait for the observer; everything in view is shown immediately
    const rv = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.remove("pre"); rv.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
    if (!reduce) document.querySelectorAll(".rv").forEach((el) => { if (el.getBoundingClientRect().top > innerHeight) { el.classList.add("pre"); rv.observe(el); } });
    document.getElementById("menuBtn")?.addEventListener("click", () => {
      const d = document.createElement("div"); d.className = "drawer"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "Menu");
      d.innerHTML = D.menu();

      const close = () => { d.classList.add("closing"); setTimeout(() => d.remove(), D.menuCloseMs || 0); };
      d.addEventListener("click", (e) => { if (e.target.closest("a") || e.target.closest("[data-close]")) close(); });
      document.body.appendChild(d); Theme.refresh();
    });
    document.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => {
      const msg = document.getElementById(b.dataset.copy);
      const ok = () => { if (msg) msg.textContent = "Email address copied"; };

    }));
    document.querySelectorAll("[data-tilt]").forEach((el) => {
      el.addEventListener("pointermove", (e) => {
        const b = el.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - 0.5, y = (e.clientY - b.top) / b.height - 0.5;
        el.style.transform = `perspective(900px) rotateX(${(-y * 6).toFixed(2)}deg) rotateY(${(x * 8).toFixed(2)}deg) translateY(-4px)`;
        el.style.setProperty("--x", e.clientX - b.left + "px"); el.style.setProperty("--y", e.clientY - b.top + "px");
      });
      el.addEventListener("pointerleave", () => { el.style.transform = ""; });
    });
    document.querySelectorAll("[data-magnet]").forEach((el) => {
      el.addEventListener("pointermove", (e) => { const b = el.getBoundingClientRect(); el.style.transform = `translate(${((e.clientX - b.left) / b.width - 0.5) * 10}px, ${((e.clientY - b.top) / b.height - 0.5) * 8}px)`; });
      el.addEventListener("pointerleave", () => { el.style.transform = ""; });
    });
  };

  addEventListener("hashchange", go);
  go();
}

function lazyScene(make) {
  let inst, want, started = false;
  return {
    mount(el) {
      want = el;
      if (inst) return inst.mount(el);
      if (started || !el) return;
      started = true;
      setTimeout(() => { try { inst = window.THREE ? make() : null; } catch (e) { inst = null; } if (inst) inst.mount(want); }, 80);
    },
  };
}

    tabs.addEventListener("mouseleave", () => place(act));
  };

  // blur-and-scale page transition
  const app = document.getElementById("app");
  const leave = () => new Promise((res) => { const a = app.animate([{ opacity: 1, filter: "blur(0)", transform: "scale(1)" }, { opacity: 0, filter: "blur(10px)", transform: "scale(.97)" }], { duration: 320, easing: "ease-in", fill: "forwards" }); a.onfinish = res; });
  const enter = () => new Promise((res) => { app.getAnimations().forEach((x) => x.cancel()); const a = app.animate([{ opacity: 0, filter: "blur(10px)", transform: "scale(1.02)" }, { opacity: 1, filter: "blur(0)", transform: "scale(1)" }], { duration: 520, easing: "cubic-bezier(.22,1,.36,1)" }); a.onfinish = res; });

  // 3D: faceted gem lit by a blue and a bronze light
  const scene = lazyScene(() => {
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(38, 1, 0.1, 100); cam.position.set(0, 0, 7);
    const host = sceneHost(renderer, cam);
    const amb = new THREE.AmbientLight(0xffffff, 0.45); sc.add(amb);
    const lb = new THREE.DirectionalLight(0x4a5fd0, 1.4); lb.position.set(-4, 2, 3); sc.add(lb);
    const lz = new THREE.DirectionalLight(0xd9a46e, 1.5); lz.position.set(4, -1, 3); sc.add(lz);
    const lw = new THREE.DirectionalLight(0xffffff, 0.5); lw.position.set(0, 4, 2); sc.add(lw);
    const g = new THREE.Group(); sc.add(g);
    const mat = new THREE.MeshLambertMaterial({ color: 0xdedfe4, flatShading: true });
    const gem = new THREE.Mesh(new THREE.IcosahedronGeometry(1.35, 0), mat); g.add(gem);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(gem.geometry), new THREE.LineBasicMaterial({ color: 0xb68756, transparent: true, opacity: 0.9 }));
    gem.add(edges);
    const shell = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(2.05, 1)), new THREE.LineBasicMaterial({ color: 0x293b93, transparent: true, opacity: 0.35 }));
    g.add(shell);
    const bits = [];
    for (let i = 0; i < 8; i++) {
      const m = new THREE.Mesh(new THREE.TetrahedronGeometry(0.12 + (i % 3) * 0.04, 0), new THREE.MeshLambertMaterial({ color: i % 2 ? 0xb68756 : 0x293b93, flatShading: true }));
      g.add(m); bits.push({ m, r: 2.3 + (i % 3) * 0.3, sp: 0.25 + i * 0.04, ph: i * 0.8, y: ((i * 37) % 10) / 10 - 0.5 });
    }
    const recolor = () => {
      const mode = Theme.get();
      mat.color.set(mode === "light" ? 0xcfd2db : mode === "gray" ? 0x8b8d96 : 0x2a2c33);
      amb.intensity = mode === "light" ? 0.55 : 0.4;
      shell.material.color.set(Theme.css("--blue-ink") || "#293b93");
    };
    recolor(); Theme.on(() => setTimeout(recolor, 30));
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let last = performance.now(), t = 0;
    const loop = (now) => {
      requestAnimationFrame(loop); const dt = Math.min((now - last) / 1000, 0.05); last = now;
      if (!host.active()) return; t += dt * (reduce ? 0.15 : 1);
      gem.rotation.set(t * 0.25, t * 0.35, 0); shell.rotation.set(-t * 0.08, t * 0.1, 0);
      gem.position.y = Math.sin(t * 1.3) * 0.08;
      bits.forEach(({ m, r, sp, ph, y }) => { const a = t * sp + ph; m.position.set(Math.cos(a) * r, y * 1.6 + Math.sin(t + ph) * 0.15, Math.sin(a) * r * 0.6); m.rotation.x += dt; m.rotation.y += dt * 0.7; });
      g.rotation.y += (pointer.x * 0.5 - g.rotation.y) * 0.05; g.rotation.x += (-pointer.y * 0.3 - g.rotation.x) * 0.05;
      renderer.render(sc, cam);
    };
    requestAnimationFrame(loop);
    return host;
  });

  startApp({ title: "GTCFC Draft 3", comingSoon, home, page, account, menu, scene, leave, enter, afterRender, menuCloseMs: 280 });
})();
</script>
